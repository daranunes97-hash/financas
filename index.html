<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
<meta name="theme-color" content="#7b4bb7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5effc;--card:#ffffff;--ink:#2a1f3a;--muted:#7d6f92;--line:#e7dcf5;
  --accent:#7b4bb7;--accent-soft:#efe5fb;--red:#c0446b;--red-soft:#fbe4ec;--blue:#6a4fb0;--blue-soft:#ece6fa;
  --pos:#7b4bb7;--on-accent:#ffffff;--grad:linear-gradient(135deg,#efe2ff 0%,#fbe3f4 100%);
  --shadow:0 1px 2px rgba(80,40,140,.06),0 3px 10px rgba(80,40,140,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18121f;--card:#231a2e;--ink:#f0e9fa;--muted:#b0a2c4;--line:#352a44;
  --accent:#c39cf2;--accent-soft:#33264a;--red:#f08aa8;--red-soft:#3e2230;--blue:#c7b2f5;--blue-soft:#2e2545;
  --pos:#c39cf2;--on-accent:#1d1228;--grad:linear-gradient(135deg,#34254d 0%,#3c2541 100%);
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{font-size:19px;margin:0;font-weight:650;text-transform:capitalize}
.navbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px}
.banner{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);margin:6px 0}
.banner.warn{background:var(--red-soft);color:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 14px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.tile.big b{font-size:22px}
.pos{color:var(--pos)}.neg{color:var(--red)}
.mood{order:-1;grid-column:1/-1;display:flex;gap:12px;align-items:center;background:var(--grad);border-radius:18px;padding:12px 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.mood .uni{width:104px;height:104px;flex:none}
.mood .txt{flex:1;min-width:0}
.mood .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mood .msg{font-size:14px;margin:2px 0 6px}
.mood b{font-size:24px}
.uni svg{width:100%;height:100%;overflow:visible}
.bob{animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
.slow{animation:bob 5s ease-in-out infinite;transform-origin:50% 90%}
.shake{animation:shake .5s ease-in-out infinite}
.tw{animation:tw 1.6s ease-in-out infinite}.tw2{animation:tw 1.6s .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.tw,.tw2{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.bob,.slow,.shake,.tw,.tw2{animation:none}}
.hdr-uni{width:30px;height:30px;display:inline-block;vertical-align:middle;margin-right:6px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.meta .top{display:flex;align-items:center;gap:10px}
.meta .emo{font-size:28px;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.meta .bar{height:12px;margin:10px 0 6px}
.meta .bar i{background:linear-gradient(90deg,#b98af0,#f39bd0)}
.meta .acts{display:flex;gap:8px;margin-top:10px}
.meta .acts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;font-weight:600}
.meta .acts button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.paycard{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow)}
.paycard.late{border-color:var(--red)}
.paycard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.paycard .hd b{font-size:22px}
.paycard ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.paycard li{display:flex;justify-content:space-between;padding:2px 0}
.done{font-size:13px;color:var(--accent);font-weight:650}
section{margin:18px 0}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;font-size:14px;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.paid .t,.paid .v{opacity:.55}
.empty{padding:14px 12px;color:var(--muted);font-size:14px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-left:6px;font-weight:600}
.sub{background:var(--bg);}
.sub .row{padding-left:30px;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:84px;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#9b6bdc,#e57fc0);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted)}
nav.tabs button span{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--accent);font-weight:650}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:24px;color:var(--muted);padding:0 4px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.out{color:var(--red)}.seg button.on.in{color:var(--accent)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.money{font-size:28px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.stepper input{width:70px;text-align:center}
.hint{font-size:13px;color:var(--blue);background:var(--blue-soft);padding:8px 10px;border-radius:10px;margin-top:8px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:16px;margin-top:16px}
.btn.ghost{background:none;color:var(--red);border:1px solid var(--line);margin-top:8px}
.btn.small{width:auto;padding:8px 14px;font-size:14px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.month-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.month-card .hd{display:flex;justify-content:space-between;font-weight:650;text-transform:capitalize}
.month-card .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0;text-transform:none;letter-spacing:0}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<button class="fab" id="fab" aria-label="Novo lançamento">+</button>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="modal"></div>

<script>
(function(){
"use strict";
// ---------- Constantes ----------
const CATS_OUT=[["Mercado","#4f8a5b"],["Casa","#8a6a4f"],["Contas","#5b6f9a"],["Transporte","#c08a2e"],["Saúde","#b5432f"],["Educação","#7a5aa6"],["Lazer","#d0679a"],["Compras","#3a9aa0"],["Alimentação fora","#e07b39"],["Outros","#8a8a85"]];
const CATS_IN=[["Salário","#7b4bb7"],["Extra","#3a9aa0"],["Outros","#8a8a85"]];
const CAT_COLOR=Object.fromEntries([...CATS_OUT,...CATS_IN.map(([n,c])=>["+"+n,c])]);
const METODOS=[["dinheiro","Dinheiro"],["pix","Pix"],["debito","Débito"],["boleto","Boleto/Carnê"]];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_C=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

// ---------- Utilidades ----------
const fmt=v=>(v<0?"-":"")+"R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function parseMoney(s){
  s=String(s||"").replace(/R\$|\s/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const n=Number(s); return isFinite(n)?Math.round(n*100)/100:NaN;
}
const moneyStr=v=>v==null||isNaN(v)?"":v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mk(y,m){y=y+Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+String(m).padStart(2,"0");}
function addM(key,n){const[y,m]=key.split("-").map(Number);return mk(y,m+n);}
const monthOf=ds=>ds.slice(0,7);
const nomeMes=key=>{const[y,m]=key.split("-").map(Number);return MESES[m-1]+" "+y;};
const curtoMes=key=>{const[y,m]=key.split("-").map(Number);return MES_C[m-1]+"/"+String(y).slice(2);};
const fmtData=ds=>{const[,m,d]=ds.split("-");return d+"/"+m;};

// ---------- Estado ----------
const S={items:new Map(),month:monthOf(todayStr()),tab:"mes",open:{},loaded:false,mode:"init",note:""};
let store=null; // {set(obj), del(id)}

const all=kind=>[...S.items.values()].filter(o=>o.kind===kind);
const cards=()=>all("card").sort((a,b)=>a.nome.localeCompare(b.nome));
const cardById=id=>{const o=S.items.get(id);return o&&o.kind==="card"?o:null;};

// mês da fatura em que a compra cai (mês de vencimento)
function faturaMes(ds,card){
  const[y,m,d]=ds.split("-").map(Number);
  const fech=Number(card.fechamento)||1, venc=Number(card.vencimento)||10;
  let cm=d>=fech?m+1:m;            // mês em que a fatura fecha
  let due=venc>fech?cm:cm+1;       // mês em que vence
  return mk(y,due);
}
// expande um lançamento em parcelas {mes,valor,i,n,tx}
function expand(tx){
  const n=Math.max(1,Number(tx.parcelas)||1);
  const card=tx.metodo==="cartao"?cardById(tx.cardId):null;
  const first=card?faturaMes(tx.data,card):monthOf(tx.data);
  const tc=Math.round(tx.valor*100), base=Math.floor(tc/n);
  const out=[];
  for(let i=0;i<n;i++){
    const c=i===n-1?tc-base*(n-1):base;
    out.push({mes:addM(first,i),valor:c/100,i:i+1,n,tx,card});
  }
  return out;
}
function fixaAtiva(f,mes){return f.inicio<=mes&&(!f.fim||mes<=f.fim);}
function fixaValor(f,mes){return f.valores&&f.valores[mes]!=null?f.valores[mes]:f.valor;}

function calcMes(mes){
  const txs=all("tx"), fixas=all("fixa").filter(f=>fixaAtiva(f,mes));
  const parcelas=[];
  txs.forEach(t=>expand(t).forEach(p=>{if(p.mes===mes)parcelas.push(p);}));
  let entradas=0,saidas=0,falta=0;const porCat={};
  const addCat=(c,v)=>{porCat[c]=(porCat[c]||0)+v;};
  parcelas.forEach(p=>{
    if(p.tx.tipo==="entrada"){entradas+=p.valor;return;}
    saidas+=p.valor;addCat(p.tx.categoria||"Outros",p.valor);
    if(p.tx.metodo==="boleto"&&!(p.tx.pagas||[]).includes(mes))falta+=p.valor;
  });
  fixas.forEach(f=>{
    const v=fixaValor(f,mes);
    if(f.tipo==="entrada")entradas+=v;
    else{saidas+=v;addCat(f.categoria||"Outros",v);if(!(f.pagas||[]).includes(mes))falta+=v;}
  });
  const faturas=cards().map(c=>{
    const ps=parcelas.filter(p=>p.card&&p.card.id===c.id&&p.tx.tipo!=="entrada");
    const total=ps.reduce((a,p)=>a+p.valor,0);
    const paga=(c.pagas||[]).includes(mes);
    if(!paga)falta+=total;
    return{card:c,ps,total,paga};
  }).filter(f=>f.ps.length);
  return{entradas,saidas,sobra:entradas-saidas,falta,porCat,parcelas,fixas,faturas};
}

// ---------- Ajustes / contas do mês ----------
function cfg(){return Object.assign({diaPag:10,lemDia:8,lemHora:"09:00"},S.items.get("config")||{});}
function pendentes(mes){
  const r=calcMes(mes),it=[];
  r.fixas.filter(f=>f.tipo!=="entrada"&&!(f.pagas||[]).includes(mes)).forEach(f=>it.push({t:"fixa",o:f,nome:f.desc,v:fixaValor(f,mes)}));
  r.faturas.filter(f=>!f.paga&&f.total>0).forEach(f=>it.push({t:"fat",o:f.card,nome:"Fatura "+f.card.nome,v:f.total}));
  r.parcelas.filter(p=>p.tx.tipo!=="entrada"&&p.tx.metodo==="boleto"&&!(p.tx.pagas||[]).includes(mes)).forEach(p=>it.push({t:"bol",o:p.tx,nome:(p.tx.desc||p.tx.categoria)+(p.n>1?" ("+p.i+"/"+p.n+")":""),v:p.valor}));
  return it;
}
function payCard(mes){
  const it=pendentes(mes);if(!it.length)return"";
  const c=cfg(),tot=it.reduce((a,x)=>a+x.v,0),hoje=todayStr(),mesHoje=monthOf(hoje),dia=Number(hoje.slice(8));
  let tit,late=false;
  if(mes<mesHoje){tit="Ficou sem baixa em "+nomeMes(mes);late=true;}
  else if(mes>mesHoje)tit="A pagar até dia "+c.diaPag;
  else if(dia<c.diaPag){const n=c.diaPag-dia;tit="Faltam "+n+" dia"+(n>1?"s":"")+" para o dia "+c.diaPag;}
  else if(dia===c.diaPag)tit="Hoje é dia de pagar! 💜";
  else{tit="Passou do dia "+c.diaPag+" e ainda falta pagar";late=true;}
  return '<div class="paycard'+(late?" late":"")+'"><div class="hd"><span style="font-weight:650">'+tit+'</span><b class="'+(late?"neg":"pos")+'">'+fmt(tot)+'</b></div>'
   +'<ul>'+it.map(x=>'<li style="align-items:center;gap:10px;padding:5px 0"><button class="check" data-a="'+({fixa:"pay-fixa",fat:"pay-fat",bol:"pay-bol"}[x.t])+'" data-id="'+x.o.id+'" aria-label="Marcar '+esc(x.nome)+' como pago"></button><span style="flex:1;color:var(--ink)">'+esc(x.nome)+'</span><span>'+fmt(x.v)+'</span></li>').join("")+'</ul>'
   +'<div style="font-size:12px;color:var(--muted);margin-top:4px">Toque no quadradinho para dar baixa em uma conta, ou pague tudo de uma vez:</div>'
   +'<button class="btn" style="margin-top:10px" data-a="pagar-tudo">'+(S.confirmPagar?"Toque de novo para confirmar ("+it.length+" contas)":"✓ Já paguei tudo")+'</button></div>';
}
async function pagarTudo(){
  const mes=S.month;
  for(const x of pendentes(mes)){const o=S.items.get(x.o.id);if(!o)continue;
    if(!(o.pagas||[]).includes(mes))await store.set(Object.assign({},o,{pagas:(o.pagas||[]).concat([mes])}));}
  S.confirmPagar=false;render();toast("Tudo pago em "+curtoMes(mes)+"! 🦄");
}
function agendaLink(){
  const c=cfg(),d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
  let ano=y,mm=m;if(d.getDate()>c.lemDia){mm++;if(mm>12){mm=1;ano++;}}
  const dd=String(c.lemDia).padStart(2,"0"),[hh,mi]=c.lemHora.split(":"),ini=ano+String(mm).padStart(2,"0")+dd+"T"+hh+mi+"00";
  const fimH=String((Number(hh)+1)%24).padStart(2,"0"),fim=ano+String(mm).padStart(2,"0")+dd+"T"+fimH+mi+"00";
  const q=new URLSearchParams({action:"TEMPLATE",text:"💜 Pagar as contas do mês",details:"Abra o Minhas Finanças para ver o total a pagar até o dia "+c.diaPag+" e dar baixa.",dates:ini+"/"+fim,ctz:"America/Sao_Paulo",recur:"RRULE:FREQ=MONTHLY;BYMONTHDAY="+c.lemDia});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}

// ---------- Unicórnio ----------
function humor(r){
  if(r.entradas<=0&&r.saidas<=0)return{k:"dorme",t:"Cochilando",m:"Nada lançado neste mês ainda. Me acorda quando entrar alguma coisa!"};
  if(r.entradas<=0)return{k:"desespero",t:"Socorro!",m:"Tem saída e nenhuma entrada lançada neste mês."};
  const p=r.sobra/r.entradas;
  if(p<0)return{k:"desespero",t:"Socorro!",m:"As saídas passaram as entradas. Bora rever os gastos?"};
  if(p<0.05)return{k:"triste",t:"Tristinho",m:"Tá quase no limite: sobra menos de 5% do que entrou."};
  if(p<0.15)return{k:"atento",t:"De olho",m:"Ainda sobra, mas tá apertando. Vai com calma."};
  if(p<0.30)return{k:"feliz",t:"Feliz",m:"Tá sobrando um dinheirinho. Muito bem!"};
  return{k:"radiante",t:"Radiante!",m:"Sobrando 30% ou mais do que entrou. Arrasou!"};
}
function unicornio(k){
  const out='#cdb6ec',W='#ffffff';
  let eyes,mouth,extra='',brows='',cheek=.55,anim='bob';
  const dot=(x)=>'<circle cx="'+x+'" cy="60" r="5" fill="#3b2550"/><circle cx="'+(x+1.8)+'" cy="58" r="1.6" fill="#fff"/>';

// ---------- Render ----------
function render(){
  renderHeader();renderTabs();
  const m=document.getElementById("main");
  if(!S.loaded){m.innerHTML='<div class="empty">Carregando seus dados…</div>'+(S.note?'<div class="banner warn">'+esc(S.note)+'</div>':'');return;}
  m.innerHTML=backupBanner()
    +(S.note?'<div class="banner">'+esc(S.note)+'</div>':'')
    +({mes:viewMes,futuro:viewFuturo,metas:viewMetas,fixas:viewFixas,cartoes:viewCartoes}[S.tab])();
  document.getElementById("fab").style.display=(S.tab==="mes"||S.tab==="futuro")?"":"none";
}
function renderHeader(){
  const h=document.getElementById("hdr");
  if(S.tab==="mes"){
    h.innerHTML='<div class="monthnav"><button class="navbtn" data-a="prev" aria-label="Mês anterior">‹</button><h1>'+nomeMes(S.month)+'</h1><div style="display:flex;gap:6px"><button class="navbtn" data-a="next" aria-label="Próximo mês">›</button><button class="navbtn" data-a="backup-menu" aria-label="Backup">⚙️</button></div></div>'
      +(S.month!==monthOf(todayStr())?'<div style="text-align:center;margin-top:4px"><button class="link" data-a="hoje">Voltar para o mês atual</button></div>':'');
  }else{
    h.innerHTML='<div class="monthnav"><h1 style="text-transform:none"><span class="hdr-uni">'+unicornio(humor(calcMes(monthOf(todayStr()))).k)+'</span>'+({futuro:"Próximos meses",metas:"Minhas metas",fixas:"Contas fixas",cartoes:"Cartões"}[S.tab])+'</h1><button class="navbtn" data-a="backup-menu" aria-label="Backup">⚙️</button></div>';
  }
}
function renderTabs(){
  const t=[["mes","🦄","Mês"],["futuro","🔮","Futuro"],["metas","💜","Metas"],["fixas","🔁","Fixas"],["cartoes","💳","Cartões"]];
  document.getElementById("tabs").innerHTML=t.map(([k,i,l])=>'<button data-tab="'+k+'" class="'+(S.tab===k?"on":"")+'"><span>'+i+'</span>'+l+'</button>').join("");
}

function viewMes(){
  const mes=S.month, r=calcMes(mes);
  let h='<div class="tiles">'
    +'<div class="tile"><small>Entradas</small><b class="pos">'+fmt(r.entradas)+'</b></div>'
    +'<div class="tile"><small>Saídas</small><b class="neg">'+fmt(r.saidas)+'</b></div>'
    +'<div class="tile"><small>Falta pagar</small><b>'+fmt(r.falta)+'</b></div>'
    +(()=>{const hm=humor(r),pct=r.entradas>0?Math.round(r.sobra/r.entradas*100):null;
      return '<div class="mood"><div class="uni">'+unicornio(hm.k)+'</div><div class="txt"><div class="lbl">'+hm.t+'</div><div class="msg">'+hm.m+'</div>'
      +'<small style="color:var(--muted)">Sobra do mês'+(pct!=null?' · '+pct+'% das entradas':'')+'</small><br><b class="'+(r.sobra>=0?"pos":"neg")+'">'+fmt(r.sobra)+'</b></div></div>';})()
    +'</div>'+payCard(mes);

  // Contas fixas
  const fx=r.fixas.slice().sort((a,b)=>(a.dia||0)-(b.dia||0));
  h+='<section><h2>Contas fixas <button class="link" data-a="go-fixas">Gerenciar</button></h2><div class="list">';
  if(!fx.length)h+='<div class="empty">Nenhuma conta fixa. Cadastre aluguel, luz, salário… na aba Fixas e elas aparecem aqui todo mês.</div>';
  fx.forEach(f=>{
    const v=fixaValor(f,mes), ent=f.tipo==="entrada", pago=(f.pagas||[]).includes(mes);
    h+='<div class="row '+(pago?"paid":"")+'"><button class="check '+(pago?"on":"")+'" data-a="pay-fixa" data-id="'+f.id+'" aria-label="Marcar como '+(ent?"recebido":"pago")+'">'+(pago?"✓":"")+'</button>'
      +'<button class="main" style="border:0;background:none;text-align:left;padding:0" data-a="fixa-mes" data-id="'+f.id+'"><div class="t">'+esc(f.desc)+'</div><div class="s">dia '+(f.dia||"–")+' · '+(pago?(ent?"recebido":"pago"):(ent?"a receber":"a pagar"))+(f.valores&&f.valores[mes]!=null?' · valor ajustado':'')+'</div></button>'
      +'<div class="v '+(ent?"pos":"")+'">'+(ent?"+":"")+fmt(v)+'</div></div>';
  });
  h+='</div></section>';

  // Faturas
  if(r.faturas.length){
    h+='<section><h2>Faturas de cartão</h2><div class="list">';
    r.faturas.forEach(f=>{
      const k="fat-"+f.card.id+"-"+mes, open=!!S.open[k];
      h+='<div class="row '+(f.paga?"paid":"")+'"><button class="check '+(f.paga?"on":"")+'" data-a="pay-fat" data-id="'+f.card.id+'" aria-label="Marcar fatura paga">'+(f.paga?"✓":"")+'</button>'
        +'<button class="main" style="border:0;background:none;text-align:left;padding:0" data-a="toggle" data-k="'+k+'"><div class="t">'+esc(f.card.nome)+' '+(open?"▾":"▸")+'</div><div class="s">vence dia '+f.card.vencimento+' · '+f.ps.length+' item(ns)'+(f.paga?' · paga':'')+'</div></button>'
        +'<div class="v">'+fmt(f.total)+'</div></div>';
      if(open){
        h+='<div class="sub">'+f.ps.sort((a,b)=>a.tx.data.localeCompare(b.tx.data)).map(p=>
          '<button class="row" data-a="edit-tx" data-id="'+p.tx.id+'"><span class="dot" style="background:'+(CAT_COLOR[p.tx.categoria]||"#888")+'"></span><div class="main"><div class="t">'+esc(p.tx.desc||p.tx.categoria)+(p.n>1?'<span class="badge">'+p.i+'/'+p.n+'</span>':'')+'</div><div class="s">compra em '+fmtData(p.tx.data)+' · '+esc(p.tx.categoria)+'</div></div><div class="v">'+fmt(p.valor)+'</div></button>').join("")+'</div>';
      }
    });
    h+='</div></section>';
  }

  // Lançamentos (fora do cartão)
  const ls=r.parcelas.filter(p=>!p.card||p.tx.tipo==="entrada").sort((a,b)=>b.tx.data.localeCompare(a.tx.data));
  h+='<section><h2>Lançamentos</h2><div class="list">';
  if(!ls.length)h+='<div class="empty">Nada lançado neste mês fora do cartão. Toque no + para adicionar.</div>';
  ls.forEach(p=>{
    const t=p.tx, ent=t.tipo==="entrada", bol=t.metodo==="boleto"&&!ent, pago=bol&&(t.pagas||[]).includes(S.month);
    const met=ent?"entrada":(METODOS.find(m=>m[0]===t.metodo)||["","Outro"])[1];
    h+='<div class="row '+(bol&&pago?"paid":"")+'">'
      +(bol?'<button class="check '+(pago?"on":"")+'" data-a="pay-bol" data-id="'+t.id+'" aria-label="Marcar parcela paga">'+(pago?"✓":"")+'</button>':'<span class="dot" style="background:'+(CAT_COLOR[ent?"+"+t.categoria:t.categoria]||"#888")+'"></span>')
      +'<button class="main" style="border:0;background:none;text-align:left;padding:0" data-a="edit-tx" data-id="'+t.id+'"><div class="t">'+esc(t.desc||t.categoria)+(p.n>1?'<span class="badge">'+p.i+'/'+p.n+'</span>':'')+'</div><div class="s">'+(p.n>1?'compra em ':'')+fmtData(t.data)+' · '+esc(t.categoria)+' · '+met+'</div></button>'
      +'<div class="v '+(ent?"pos":"")+'">'+(ent?"+":"")+fmt(p.valor)+'</div></div>';
  });
  h+='</div></section>';

  // Por categoria
  const cats=Object.entries(r.porCat).sort((a,b)=>b[1]-a[1]);
  h+='<section><h2>Para onde foi o dinheiro</h2><div class="list">';
  if(!cats.length)h+='<div class="empty">Sem saídas neste mês.</div>';
  const max=cats.length?cats[0][1]:1;
  cats.forEach(([c,v])=>{
    const pct=r.saidas?Math.round(v/r.saidas*100):0;
    h+='<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>'+esc(c)+' <span class="s" style="color:var(--muted);font-size:12px">'+pct+'%</span></span><span class="v">'+fmt(v)+'</span></div><div class="bar"><i style="width:'+(v/max*100)+'%;background:'+(CAT_COLOR[c]||"#888")+'"></i></div></div>';
  });
  h+='</div></section>';
  return h;
}

function viewFuturo(){
  const base=monthOf(todayStr());
  let h='<section><h2>Previsão dos próximos 6 meses</h2>';
  for(let i=0;i<6;i++){
    const mes=addM(base,i), r=calcMes(mes);
    const parc=r.parcelas.filter(p=>p.n>1&&p.tx.tipo!=="entrada").reduce((a,p)=>a+p.valor,0);
    const fixS=r.fixas.filter(f=>f.tipo!=="entrada").reduce((a,f)=>a+fixaValor(f,mes),0);
    h+='<div class="month-card"><div class="hd"><span>'+nomeMes(mes)+(i===0?' <span class="badge">atual</span>':'')+'</span><span class="'+(r.sobra>=0?"pos":"neg")+'">'+fmt(r.sobra)+'</span></div>'
      +'<div class="ln"><span>Entradas previstas</span><span>'+fmt(r.entradas)+'</span></div>'
      +'<div class="ln"><span>Parcelas já assumidas</span><span>'+fmt(parc)+'</span></div>'
      +'<div class="ln"><span>Contas fixas</span><span>'+fmt(fixS)+'</span></div>'
      +'<div class="ln"><span>Total de saídas</span><span>'+fmt(r.saidas)+'</span></div></div>';
  }
  h+='</section>';
  // parcelamentos em andamento
  const now=base;
  const ativos=all("tx").filter(t=>t.tipo!=="entrada"&&(Number(t.parcelas)||1)>1).map(t=>{
    const ps=expand(t), rest=ps.filter(p=>p.mes>=now);
    return{t,ps,rest,fim:ps[ps.length-1].mes};
  }).filter(a=>a.rest.length).sort((a,b)=>a.fim.localeCompare(b.fim));
  h+='<section><h2>Parcelamentos em andamento</h2><div class="list">';
  if(!ativos.length)h+='<div class="empty">Nenhuma compra parcelada em aberto.</div>';
  ativos.forEach(a=>{
    const falta=a.rest.reduce((s,p)=>s+p.valor,0), feitas=a.ps.length-a.rest.length;
    const onde=a.t.metodo==="cartao"?(cardById(a.t.cardId)||{nome:"Cartão"}).nome:"Boleto/Carnê";
    h+='<button class="row" data-a="edit-tx" data-id="'+a.t.id+'" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><span class="t">'+esc(a.t.desc||a.t.categoria)+'</span><span class="v">'+fmt(falta)+'</span></div>'
      +'<div class="s">'+esc(onde)+' · '+a.ps[0].n+'x de '+fmt(a.ps[0].valor)+' · faltam '+a.rest.length+' · última em '+curtoMes(a.fim)+'</div>'
      +'<div class="bar"><i style="width:'+(feitas/a.ps.length*100)+'%;background:var(--accent)"></i></div></button>';
  });
  h+='</div></section>';
  return h;
}

function viewFixas(){
  const fx=all("fixa").sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==="entrada"?-1:1)||(a.dia||0)-(b.dia||0));
  let h='<section><h2>Entram ou saem todo mês <button class="btn small" data-a="new-fixa">+ Nova</button></h2><div class="list">';
  if(!fx.length)h+='<div class="empty">Cadastre aqui o que se repete todo mês (salário, aluguel, luz, internet, escola…). Elas aparecem sozinhas em cada mês, e você só marca como pago.</div>';

const EMOJIS=["🦄","🏖️","🏠","🚗","✈️","🎓","💍","🎁","💻","🛟","🐷","🌈"];
function metaInfo(m){
  const guard=Math.round((m.depositos||[]).reduce((a,d)=>a+d.valor,0)*100)/100;
  const falta=Math.max(0,m.alvo-guard), pct=m.alvo>0?Math.min(100,guard/m.alvo*100):0;
  let porMes=null,meses=null;
  if(m.prazo&&falta>0){const now=monthOf(todayStr());const[a,b]=now.split("-").map(Number),[c,d]=m.prazo.split("-").map(Number);meses=(c-a)*12+(d-b)+1;if(meses>=1)porMes=falta/meses;}
  return{guard,falta,pct,porMes,meses};
}
function viewMetas(){
  const ms=all("meta").sort((a,b)=>(a.criado||"").localeCompare(b.criado||""));
  const tot=ms.reduce((a,m)=>a+metaInfo(m).guard,0);
  let h='<div class="tiles"><div class="tile" style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--grad)"><div><small>Total guardado nas metas</small><span style="font-size:12px;color:var(--muted)">fica separado do saldo do mês</span></div><b class="pos" style="font-size:22px">'+fmt(tot)+'</b></div></div>';
  h+='<section><h2>Metas <button class="btn small" data-a="new-meta">+ Nova meta</button></h2>';
  if(!ms.length)h+='<div class="list"><div class="empty">Crie uma meta (viagem, reserva de emergência, um sonho…) e vá registrando cada valor que guardar. O unicórnio comemora quando você bater!</div></div>';
  ms.forEach(m=>{
    const i=metaInfo(m), ok=i.falta<=0;
    let sub;
    if(ok)sub='<span class="done">🦄✨ Meta batida! Parabéns!</span>';
    else if(i.porMes!=null)sub='Faltam '+fmt(i.falta)+' · guarde <b>'+fmt(i.porMes)+'/mês</b> para chegar em '+curtoMes(m.prazo);
    else if(m.prazo)sub='Faltam '+fmt(i.falta)+' · <span class="neg">o prazo ('+curtoMes(m.prazo)+') já passou</span>';
    else sub='Faltam '+fmt(i.falta);
    h+='<div class="meta"><button class="top" data-a="edit-meta" data-id="'+m.id+'" style="border:0;background:none;padding:0;width:100%;text-align:left"><span class="emo">'+esc(m.emoji||"💜")+'</span><span style="flex:1;min-width:0"><span class="t" style="display:block;font-weight:650">'+esc(m.nome)+'</span><span class="s" style="font-size:12px;color:var(--muted)">'+fmt(i.guard)+' de '+fmt(m.alvo)+'</span></span><b class="pos">'+Math.floor(i.pct)+'%</b></button>'
      +'<div class="bar"><i style="width:'+i.pct+'%"></i></div><div class="s" style="font-size:13px;color:var(--muted)">'+sub+'</div>'
      +'<div class="acts"><button class="pri" data-a="dep-meta" data-id="'+m.id+'">+ Guardar</button><button data-a="ret-meta" data-id="'+m.id+'">Retirar</button></div></div>';
  });
  return h+'</section>';
}
function metaForm(m){
  const x=m?JSON.parse(JSON.stringify(m)):{id:null,kind:"meta",nome:"",alvo:null,prazo:"",emoji:"🦄",depositos:[],criado:new Date().toISOString()};
  F={type:"meta",t:x,valStr:x.alvo!=null?moneyStr(x.alvo):"",confirmDel:false,err:""};drawMeta();
}
function drawMeta(){
  const x=F.t;
  const deps=(x.depositos||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
  let h='<h3>'+(x.id?"Editar meta":"Nova meta")+'<button class="x" data-a="close">×</button></h3>'

function limiteUsado(card,excluir){
  const now=monthOf(todayStr());let u=0;
  all("tx").forEach(t=>{if(t.cardId!==card.id||t.tipo==="entrada"||t.id===excluir)return;
    expand(t).forEach(p=>{if(p.mes>=now&&!(card.pagas||[]).includes(p.mes))u+=p.valor;});});
  return Math.round(u*100)/100;
}
function viewCartoes(){
  const cs=cards();
  let h='<section><h2>Seus cartões <button class="btn small" data-a="new-card">+ Novo</button></h2><div class="list">';
  if(!cs.length)h+='<div class="empty">Cadastre seu cartão com o dia de fechamento e o de vencimento. Assim cada parcela cai sozinha na fatura certa.</div>';
  cs.forEach(c=>{
    let lim='';
    if(c.limite>0){const u=limiteUsado(c),d=c.limite-u,pct=Math.min(100,Math.max(0,u/c.limite*100));
      lim='<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:14px"><span>Disponível</span><b class="'+(d<0?"neg":"pos")+'">'+fmt(d)+'</b></div>'
        +'<div class="bar"><i style="width:'+pct+'%;background:'+(pct>=90?"var(--red)":"linear-gradient(90deg,#b98af0,#f39bd0)")+'"></i></div>'
        +'<div class="s">Usado '+fmt(u)+' de '+fmt(c.limite)+(d<0?' · <span class="neg">passou do limite</span>':pct>=90?' · <span class="neg">quase no limite</span>':'')+'</div>';}
    else lim='<div class="s" style="margin-top:4px">Toque para informar o limite</div>';
    h+='<button class="row" data-a="edit-card" data-id="'+c.id+'" style="display:block"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">💳</span><div class="main"><div class="t">'+esc(c.nome)+'</div><div class="s">fecha dia '+c.fechamento+' · vence dia '+c.vencimento+'</div></div><span class="s">editar</span></div>'+lim+'</button>';
  });
  h+='</div></section><div class="banner">O limite volta quando você marca a fatura como paga, e as faturas de meses que já passaram contam como pagas. Compra parcelada ocupa o valor total e vai liberando a cada fatura paga, igual ao banco.</div><div class="banner">Como funciona: compra feita <b>no dia do fechamento ou depois</b> vai para a fatura seguinte. Cada parcela aparece no mês em que a fatura <b>vence</b>.</div>';
  return h;
}

function readTxInputs(){
  if(!F||F.type!=="tx")return;
  const v=document.getElementById("fv"),d=document.getElementById("fd"),p=document.getElementById("fp"),dt=document.getElementById("fdt");
  if(v)F.valStr=v.value; if(d)F.t.desc=d.value; if(dt&&dt.value)F.t.data=dt.value;
  if(p){const n=parseInt(p.value,10);F.t.parcelas=Math.min(120,Math.max(1,isNaN(n)?1:n));}

function txValorTotal(){
  const v=parseMoney(F.valStr);if(isNaN(v))return NaN;
  return F.modoValor==="parcela"&&F.t.parcelas>1?Math.round(v*F.t.parcelas*100)/100:v;
}
function updatePreview(){
  const el=document.getElementById("prev");if(!el||!F||F.type!=="tx")return;
  const t=F.t,tot=txValorTotal();
  const cardSel=t.tipo!=="entrada"&&t.metodo==="cartao"?cardById(t.cardId):null;
  let limH="";
  if(cardSel&&cardSel.limite>0){const d=cardSel.limite-limiteUsado(cardSel,t.id),dep=d-(isNaN(tot)?0:tot);
    limH='<div class="hint" style="'+(dep<0?'background:var(--red-soft);color:var(--red)':'')+'">Limite disponível no '+esc(cardSel.nome)+': <b>'+fmt(d)+'</b>'+(!isNaN(tot)&&tot>0?'<br>Depois desta compra: <b>'+fmt(dep)+'</b>'+(dep<0?' · passa do limite!':''):'')+'</div>';}
  if(t.tipo==="entrada"||isNaN(tot)||tot<=0){el.innerHTML=limH;return;}
  const tmp=Object.assign({},t,{valor:tot});
  const card=t.metodo==="cartao"?cardById(t.cardId):null;
  if(!card&&t.parcelas<=1){el.innerHTML=limH;return;}
  const ps=expand(tmp);
  let s;
  if(ps.length>1)s=ps.length+'x de '+fmt(ps[0].valor)+(ps[ps.length-1].valor!==ps[0].valor?' (última '+fmt(ps[ps.length-1].valor)+')':'')+' · total '+fmt(tot)+'<br>1ª parcela em <b>'+nomeMes(ps[0].mes)+'</b>, última em <b>'+nomeMes(ps[ps.length-1].mes)+'</b>';
  else s='Entra na fatura que vence em <b>'+nomeMes(ps[0].mes)+'</b>';
  el.innerHTML='<div class="hint">'+s+'</div>'+limH;
}
async function saveTx(){

  if(t.tipo!=="entrada"&&t.metodo==="cartao"&&!cardById(t.cardId)){F.err="Escolha o cartão.";drawTx();return;}
  const o={kind:"tx",id:t.id||uid(),tipo:t.tipo,valor:tot,desc:(t.desc||"").trim(),categoria:t.categoria,
    metodo:t.tipo==="entrada"?"entrada":t.metodo,cardId:t.metodo==="cartao"?t.cardId:null,parcelas:t.parcelas||1,data:t.data,pagas:t.pagas||[]};

}

async function saveCard(){

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-a],[data-f],[data-tab]");
  if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;window.scrollTo(0,0);render();return;}
  const a=b.dataset.a, id=b.dataset.id;
  if(a==="close-bg"){if(ev.target===b)closeSheet();return;}
  if(b.dataset.f){ // campos de formulário
    ev.preventDefault();
    const f=b.dataset.f,v=b.dataset.v;
    if(F.type==="tx"){readTxInputs();
      if(f==="tipo")F.t.tipo=v; if(f==="categoria")F.t.categoria=v;
      if(f==="metodo"){F.t.metodo=v;F.t.cardId=null;} if(f==="card"){F.t.metodo="cartao";F.t.cardId=v;}
      if(f==="modo")F.modoValor=v; F.err=""; drawTx();
    }else if(F.type==="fixa"){readFixa(); if(f==="tipo")F.t.tipo=v; if(f==="categoria")F.t.categoria=v; drawFixa();}
    else if(F.type==="meta"){readMeta(); if(f==="emoji")F.t.emoji=v; drawMeta();}
    return;
  }
  switch(a){
    case"prev":S.month=addM(S.month,-1);render();break;
    case"next":S.month=addM(S.month,1);render();break;
    case"hoje":S.month=monthOf(todayStr());render();break;
    case"toggle":S.open[b.dataset.k]=!S.open[b.dataset.k];render();break;
    case"go-fixas":S.tab="fixas";render();break;
    case"go-cartoes":closeSheet();S.tab="cartoes";render();cardForm();break;
    case"close":closeSheet();break;
    case"edit-tx":{const t=S.items.get(id);if(t)txForm(t);break;}
    case"parc-":case"parc+":readTxInputs();F.t.parcelas=Math.min(120,Math.max(1,F.t.parcelas+(a==="parc+"?1:-1)));drawTx();break;
    case"save-tx":await saveTx();break;
    case"del-tx":if(!F.confirmDel){readTxInputs();F.confirmDel=true;drawTx();}else{const i=F.t.id;closeSheet();await store.del(i);toast("Lançamento apagado");}break;
    case"new-fixa":fixaForm();break;
    case"edit-fixa":{const f=S.items.get(id);if(f)fixaForm(f);break;}
    case"save-fixa":await saveFixa();break;
    case"del-fixa":if(!F.confirmDel){readFixa();F.confirmDel=true;drawFixa();}else{const i=F.t.id;closeSheet();await store.del(i);}break;
    case"fixa-mes":{const f=S.items.get(id);if(f)fixaMesForm(f);break;}
    case"save-fixames":case"reset-fixames":{
      const f=S.items.get(F.id);if(!f)return;const valores=Object.assign({},f.valores||{});
      if(a==="reset-fixames")delete valores[S.month];
      else{const v=parseMoney(document.getElementById("mv").value);if(isNaN(v)||v<0){document.getElementById("merr").innerHTML='<div class="err">Valor inválido.</div>';return;}
        if(v===f.valor)delete valores[S.month];else valores[S.month]=v;}
      closeSheet();await store.set(Object.assign({},f,{valores}));break;}
    case"pay-fixa":{const f=S.items.get(id);if(f){const ja=(f.pagas||[]).includes(S.month);await store.set(Object.assign({},f,{pagas:toggleIn(f.pagas,S.month)}));if(!ja)toast(f.desc+" pago ✓");}break;}
    case"pay-fat":{const c=S.items.get(id);if(c){const ja=(c.pagas||[]).includes(S.month);await store.set(Object.assign({},c,{pagas:toggleIn(c.pagas,S.month)}));if(!ja)toast("Fatura "+c.nome+" paga ✓");}break;}
    case"pay-bol":{const t=S.items.get(id);if(t)await store.set(Object.assign({},t,{pagas:toggleIn(t.pagas,S.month)}));break;}
    case"new-meta":metaForm();break;
    case"edit-meta":{const m=S.items.get(id);if(m)metaForm(m);break;}
    case"save-meta":await saveMeta();break;
    case"del-meta":if(!F.confirmDel){readMeta();F.confirmDel=true;drawMeta();}else{const i=F.t.id;closeSheet();await store.del(i);}break;
    case"del-dep":{readMeta();const mid=F.t.id;F.t.depositos=(F.t.depositos||[]).filter(d=>d.id!==id);const m=S.items.get(mid);if(m)await store.set(Object.assign({},m,{depositos:F.t.depositos}));drawMeta();break;}
    case"dep-meta":case"ret-meta":{const m=S.items.get(id);if(m)depForm(m,a==="dep-meta"?1:-1);break;}
    case"save-dep":await saveDep();break;
    case"backup-menu":backupMenu();break;
    case"save-cfg":{const g=id=>parseInt(document.getElementById(id).value,10);const dp=g("cfg-dia"),ld=g("cfg-ldia"),lh=document.getElementById("cfg-lhora").value||"09:00";
      if(!(dp>=1&&dp<=31)||!(ld>=1&&ld<=28)){toast("Dia de pagamento 1–31; lembrete 1–28");break;}
      await store.set({kind:"config",id:"config",diaPag:dp,lemDia:ld,lemHora:lh});backupMenu();toast("Ajustes salvos");break;}
    case"pagar-tudo":if(!S.confirmPagar){S.confirmPagar=true;render();setTimeout(()=>{if(S.confirmPagar){S.confirmPagar=false;render();}},4000);}else await pagarTudo();break;
    case"do-backup":await doBackup();break;
    case"confirm-restore":{mem={};F.itens.forEach(o=>{mem[o.id]=o;});persist();closeSheet();applyAll();toast("Backup restaurado 💜");break;}
    case"new-card":cardForm();break;
    case"edit-card":{const c=S.items.get(id);if(c)cardForm(c);break;}
    case"save-card":await saveCard();break;
    case"del-card":{if(all("tx").some(t=>t.cardId===F.t.id))return;if(!F.confirmDel){F.confirmDel=true;drawCard();}else{const i=F.t.id;closeSheet();await store.del(i);}break;}
  }
});
document.getElementById("fab").addEventListener("click",()=>txForm());
document.addEventListener("input",ev=>{
  if(!F||F.type!=="tx")return;
  if(["fv","fp","fdt"].includes(ev.target.id)){readTxInputs();updatePreview();}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&F)closeSheet();
  if(ev.key==="Enter"&&F&&ev.target.tagName==="INPUT"){ev.preventDefault();
    if(F.type==="tx")saveTx();else if(F.type==="fixa")saveFixa();else if(F.type==="card")saveCard();
    else if(F.type==="meta")saveMeta();else if(F.type==="dep")saveDep();else if(F.type==="fixames"){const b=document.querySelector('[data-a="save-fixames"]');b&&b.click();}}
});

// ---------- Armazenamento (só neste aparelho) ----------
const KEY="financas-v1", KEY_BK="financas-ultimo-backup";
let mem={};
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(mem));return true;}
  catch(e){S.note="Não consegui salvar no celular (memória cheia?). Faça um backup agora.";render();return false;}
}
function applyAll(){S.items=new Map(Object.values(mem).map(o=>[o.id,o]));S.loaded=true;render();}
store={
  async set(o){mem[o.id]=JSON.parse(JSON.stringify(o));persist();applyAll();},
  async del(id){delete mem[id];persist();applyAll();}
};
function ultimoBackup(){try{return Number(localStorage.getItem(KEY_BK))||0;}catch(e){return 0;}}
function backupBanner(){
  if(!S.items.size)return"";
  const ult=ultimoBackup(), dias=ult?Math.floor((Date.now()-ult)/864e5):null;
  if(dias!=null&&dias<7)return"";
  return '<div class="banner" style="display:flex;gap:10px;align-items:center"><span style="flex:1">🦄 '+(dias==null?"Você ainda não fez nenhum backup.":"Já faz "+dias+" dias desde o último backup.")+' Seus dados ficam só neste celular.</span><button class="btn small" data-a="do-backup">Fazer backup</button></div>';
}
function backupMenu(){
  F={type:"backup"};
  const ult=ultimoBackup();
  const c=cfg();
  openSheet('<h3>Ajustes<button class="x" data-a="close">×</button></h3>'
   +'<label class="f">Dia em que você paga as contas</label><input class="inp" id="cfg-dia" inputmode="numeric" value="'+c.diaPag+'">'
   +'<label class="f" style="margin-top:16px">Lembrete no Google Agenda (todo mês)</label>'
   +'<div class="two"><div><label class="f">Dia do lembrete</label><input class="inp" id="cfg-ldia" inputmode="numeric" value="'+c.lemDia+'"></div><div><label class="f">Horário</label><input class="inp" type="time" id="cfg-lhora" value="'+c.lemHora+'"></div></div>'
   +'<button class="btn" data-a="save-cfg" style="margin-top:10px">Salvar ajustes</button>'
   +'<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;color:var(--accent)" href="'+agendaLink()+'" target="_blank" rel="noopener">📅 Criar lembrete no Google Agenda</a>'
   +'<p style="font-size:13px;color:var(--muted);margin:6px 0 0">Salve os ajustes antes. Abre o Google Agenda com o lembrete pronto: confira se está na sua conta pessoal e toque em Salvar. A notificação chega mesmo com o app fechado.</p>'
   +'<h3 style="margin-top:22px">Backup dos seus dados</h3>'
   +'<p style="margin:0 0 10px;color:var(--muted);font-size:14px">Seus dados ficam guardados só neste celular, sem internet e sem login. Se trocar de aparelho, perder o celular ou limpar os dados do Chrome, só o backup salva você.</p>'
   +'<div class="hint">Último backup: <b>'+(ult?new Date(ult).toLocaleDateString("pt-BR")+' às '+new Date(ult).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"nunca")+'</b> · '+S.items.size+' registro(s) no app</div>'
   +'<button class="btn" data-a="do-backup">💾 Fazer backup agora</button>'
   +'<p style="font-size:13px;color:var(--muted);margin:8px 0 0">Guarde o arquivo no seu Google Drive pessoal ou mande para você mesma no WhatsApp.</p>'
   +'<label class="btn ghost" style="display:block;text-align:center;color:var(--ink);cursor:pointer">📂 Restaurar de um backup<input type="file" id="restore-file" accept=".json,application/json" style="display:none"></label>');
}
async function doBackup(){
  const d=new Date(), nome="financas-backup-"+todayStr()+".json";
  const json=JSON.stringify({app:"minhas-financas",versao:1,criado:d.toISOString(),itens:Object.values(mem)},null,1);
  const blob=new Blob([json],{type:"application/json"});
  let ok=false;
  try{
    const file=new File([blob],nome,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup Minhas Finanças"});ok=true;}
  }catch(e){if(e&&e.name==="AbortError"){return;}}
  if(!ok){
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);ok=true;
  }
  try{localStorage.setItem(KEY_BK,String(Date.now()));}catch(e){}
  closeSheet();render();toast("Backup feito! 💜");
}
function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;try{data=JSON.parse(r.result);}catch(e){data=null;}
    if(!data||data.app!=="minhas-financas"||!Array.isArray(data.itens)){
      openSheet('<h3>Arquivo inválido<button class="x" data-a="close">×</button></h3><p>Esse arquivo não é um backup do Minhas Finanças.</p><button class="btn" data-a="close">Ok</button>');F={type:"msg"};return;}
    F={type:"restore",itens:data.itens.filter(o=>o&&o.id&&o.kind)};
    openSheet('<h3>Restaurar backup?<button class="x" data-a="close">×</button></h3>'
     +'<p>Backup de <b>'+new Date(data.criado).toLocaleDateString("pt-BR")+'</b> com '+F.itens.length+' registro(s).</p>'
     +'<div class="banner warn">Isso <b>substitui</b> tudo o que está no app agora ('+S.items.size+' registro(s)).</div>'
     +'<button class="btn" data-a="confirm-restore">Sim, restaurar</button><button class="btn ghost" style="color:var(--ink)" data-a="close">Cancelar</button>');
  };
  r.readAsText(file);
}
document.addEventListener("change",ev=>{if(ev.target.id==="restore-file"&&ev.target.files[0])restoreFile(ev.target.files[0]);});

function init(){
  try{mem=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){mem={};}
  applyAll();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
}
init();
})();
</script>
