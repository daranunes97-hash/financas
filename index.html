<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minhas Finanças</title>
<meta name="theme-color" content="#7b4bb7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f5effc;--card:#ffffff;--ink:#2a1f3a;--muted:#7d6f92;--line:#e7dcf5;
  --accent:#7b4bb7;--accent-soft:#efe5fb;--red:#c0446b;--red-soft:#fbe4ec;--blue:#6a4fb0;--blue-soft:#ece6fa;
  --pos:#7b4bb7;--on-accent:#ffffff;--grad:linear-gradient(135deg,#efe2ff 0%,#fbe3f4 100%);
  --shadow:0 1px 2px rgba(80,40,140,.06),0 3px 10px rgba(80,40,140,.06);--g1:#9b6bdc;--g2:#e57fc0;--b1:#b98af0;--b2:#f39bd0;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18121f;--card:#231a2e;--ink:#f0e9fa;--muted:#b0a2c4;--line:#352a44;
  --accent:#c39cf2;--accent-soft:#33264a;--red:#f08aa8;--red-soft:#3e2230;--blue:#c7b2f5;--blue-soft:#2e2545;
  --pos:#c39cf2;--on-accent:#1d1228;--grad:linear-gradient(135deg,#34254d 0%,#3c2541 100%);
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{font-size:19px;margin:0;font-weight:650;text-transform:capitalize}
.navbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px}
.banner{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--blue-soft);color:var(--blue);margin:6px 0}
.banner.warn{background:var(--red-soft);color:var(--red)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 14px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.tile.big b{font-size:22px}
.pos{color:var(--pos)}.neg{color:var(--red)}
.mood{order:-1;grid-column:1/-1;display:flex;gap:12px;align-items:center;background:var(--grad);border-radius:18px;padding:12px 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.mood .uni{width:104px;height:104px;flex:none}
.mood .txt{flex:1;min-width:0}
.mood .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mood .msg{font-size:14px;margin:2px 0 6px}
.mood b{font-size:24px}
.uni svg{width:100%;height:100%;overflow:visible}
.bob{animation:bob 3s ease-in-out infinite;transform-origin:50% 90%}
.slow{animation:bob 5s ease-in-out infinite;transform-origin:50% 90%}
.shake{animation:shake .5s ease-in-out infinite}
.tw{animation:tw 1.6s ease-in-out infinite}.tw2{animation:tw 1.6s .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
.tw,.tw2{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.bob,.slow,.shake,.tw,.tw2{animation:none}}
.hdr-uni{width:30px;height:30px;display:inline-block;vertical-align:middle;margin-right:6px}
.meta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.meta .top{display:flex;align-items:center;gap:10px}
.meta .emo{font-size:28px;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.meta .bar{height:12px;margin:10px 0 6px}
.meta .bar i{background:linear-gradient(90deg,var(--b1),var(--b2))}
.meta .acts{display:flex;gap:8px;margin-top:10px}
.meta .acts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;font-weight:600}
.meta .acts button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.paycard{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:12px 14px;margin:0 0 14px;box-shadow:var(--shadow)}
.paycard.late{border-color:var(--red)}
.paycard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.paycard .hd b{font-size:22px}
.paycard ul{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.paycard li{display:flex;justify-content:space-between;padding:2px 0}
.done{font-size:13px;color:var(--accent);font-weight:650}
section{margin:18px 0}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;font-size:14px;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.paid .t,.paid .v{opacity:.55}
.empty{padding:14px 12px;color:var(--muted);font-size:14px}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-left:6px;font-weight:600}
.sub{background:var(--bg);}
.sub .row{padding-left:30px;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:84px;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--muted)}
nav.tabs button span{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--accent);font-weight:650}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:24px;color:var(--muted);padding:0 4px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.out{color:var(--red)}.seg button.on.in{color:var(--accent)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.money{font-size:28px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.stepper input{width:70px;text-align:center}
.hint{font-size:13px;color:var(--blue);background:var(--blue-soft);padding:8px 10px;border-radius:10px;margin-top:8px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:16px;margin-top:16px}
.btn.ghost{background:none;color:var(--red);border:1px solid var(--line);margin-top:8px}
.btn.small{width:auto;padding:8px 14px;font-size:14px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.month-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.month-card .hd{display:flex;justify-content:space-between;font-weight:650;text-transform:capitalize}
.month-card .ln{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0;text-transform:none;letter-spacing:0}
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tema{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px}
.tema.on{border-color:var(--accent);color:var(--accent)}
.tema i{width:30px;height:30px;border-radius:50%;display:block}
.tema .mini{width:56px;height:56px;display:block}.tema .mini svg{width:100%;height:100%;overflow:visible}.tema .mini .bob{animation:none}
.busca{display:flex;gap:6px;margin-bottom:8px}
.busca input{flex:1;background:var(--card)}
.busca-info{font-size:13px;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<button class="fab" id="fab" aria-label="Novo lançamento">+</button>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="modal"></div>

<script>
(function(){
"use strict";
// ---------- Constantes ----------
const VERSAO="12/nov · detalhe das categorias";
const DEF_OUT=[["Mercado","#4f8a5b"],["Casa","#8a6a4f"],["Contas","#5b6f9a"],["Empréstimo","#c0446b"],["Eletrodomésticos","#4a86c8"],["Roupas e calçados","#d65fa8"],["Transporte","#c08a2e"],["Saúde","#b5432f"],["Educação","#7a5aa6"],["Lazer","#e07b9a"],["Compras","#3a9aa0"],["Alimentação fora","#e07b39"],["Outros","#8a8a85"]];
const DEF_IN=[["Salário","#7b4bb7"],["Extra","#3a9aa0"],["Outros","#8a8a85"]];
const PALETA=["#9b6bdc","#e57fc0","#4a86c8","#3a9aa0","#4f8a5b","#c08a2e","#e07b39","#c0446b","#7a5aa6","#8a6a4f","#5b6f9a","#d0679a"];
const METODOS=[["dinheiro","Dinheiro"],["pix","Pix"],["debito","Débito"],["boleto","Carnê/Boleto"],["pessoa","Direto pra pessoa"],["pai","👨 Pai paga"]];
const COM_BAIXA=m=>m==="boleto"||m==="pessoa";
function getCats(tipo){const c=S.items.get("cats"),k=tipo==="entrada"?"entrada":"saida";return (c&&Array.isArray(c[k])&&c[k].length)?c[k]:(k==="entrada"?DEF_IN:DEF_OUT);}
function catColor(n,ent){if(n===CAT_JUROS)return"#e04f4f";if(n===CAT_COFRE)return"#e57fc0";const f=getCats(ent?"entrada":"saida").find(x=>x[0]===n);return f?f[1]:"#8a8a85";}
async function saveCats(tipo,list){const o={kind:"cats",id:"cats",saida:getCats("saida"),entrada:getCats("entrada")};o[tipo==="entrada"?"entrada":"saida"]=list;await store.set(o);}
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES_C=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

// ---------- Utilidades ----------
const fmt=v=>(v<0?"-":"")+"R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function parseMoney(s){
  s=String(s||"").replace(/R\$|\s/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const n=Number(s); return isFinite(n)?Math.round(n*100)/100:NaN;
}
const moneyIn=v=>v==null||isNaN(v)||v===""?"":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function mascaraValor(el){
  const dig=el.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,11);
  el.value=dig?moneyIn(Number(dig)/100):"";
  try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
}
document.addEventListener("input",ev=>{if(ev.target.classList&&ev.target.classList.contains("money-in"))mascaraValor(ev.target);},true);
const moneyStr=v=>v==null||isNaN(v)?"":v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mk(y,m){y=y+Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+String(m).padStart(2,"0");}
function addM(key,n){const[y,m]=key.split("-").map(Number);return mk(y,m+n);}
const monthOf=ds=>ds.slice(0,7);
const nomeMes=key=>{const[y,m]=key.split("-").map(Number);return MESES[m-1]+" "+y;};
const curtoMes=key=>{const[y,m]=key.split("-").map(Number);return MES_C[m-1]+"/"+String(y).slice(2);};
const fmtData=ds=>{const[,m,d]=ds.split("-");return d+"/"+m;};

// ---------- Temas (cada celular guarda o seu) ----------
// [nome, cor da bolinha, claro{...}, escuro{...}]
const TEMAS={
  lilas:["Lilás","#7b4bb7",
    {bg:"#f5effc",card:"#ffffff",ink:"#2a1f3a",muted:"#7d6f92",line:"#e7dcf5",accent:"#7b4bb7",soft:"#efe5fb",red:"#c0446b",redSoft:"#fbe4ec",blue:"#6a4fb0",blueSoft:"#ece6fa",grad:"#efe2ff,#fbe3f4",g:"#9b6bdc,#e57fc0",b:"#b98af0,#f39bd0",sh:"80,40,140"},
    {bg:"#18121f",card:"#231a2e",ink:"#f0e9fa",muted:"#b0a2c4",line:"#352a44",accent:"#c39cf2",soft:"#33264a",red:"#f08aa8",redSoft:"#3e2230",blue:"#c7b2f5",blueSoft:"#2e2545",grad:"#34254d,#3c2541",onAccent:"#1d1228"}],
  azul:["Azul","#2f6fb5",
    {bg:"#eef4fb",card:"#ffffff",ink:"#1b2a3a",muted:"#66788c",line:"#d6e3f2",accent:"#2f6fb5",soft:"#e1edfa",red:"#c0392b",redSoft:"#fbe3e0",blue:"#2f6fb5",blueSoft:"#e1edfa",grad:"#dcebfb,#ddf4f2",g:"#4a8fd8,#36b0ad",b:"#6aa6e6,#5cc8c2",sh:"30,70,130"},
    {bg:"#111820",card:"#1a2430",ink:"#e6eef7",muted:"#9fb0c2",line:"#2a3747",accent:"#7fb4ef",soft:"#1f3247",red:"#f08a80",redSoft:"#3d2222",blue:"#8fbff2",blueSoft:"#1f3247",grad:"#1e3149,#1b3a3a",onAccent:"#0e1a27"}],
  verde:["Verde","#2f8a5b",
    {bg:"#eff7f1",card:"#ffffff",ink:"#1c2e23",muted:"#688070",line:"#d3e8da",accent:"#2f8a5b",soft:"#def1e5",red:"#c0392b",redSoft:"#fbe3e0",blue:"#2f7a6a",blueSoft:"#dcefe9",grad:"#dff3e6,#eef5d6",g:"#3fa36b,#8fbf3a",b:"#62bb87,#b0d66a",sh:"30,90,50"},
    {bg:"#111a15",card:"#1a261f",ink:"#e5f2ea",muted:"#9fb8a8",line:"#2a3b31",accent:"#7fd0a0",soft:"#1f3a2a",red:"#f08a80",redSoft:"#3d2222",blue:"#8fd6c4",blueSoft:"#1f3a33",grad:"#1f3a2a,#2b3a1c",onAccent:"#0e1d14"}],
  rosa:["Rosa","#c2407f",
    {bg:"#fdf0f6",card:"#ffffff",ink:"#3a1c2b",muted:"#8f6a7c",line:"#f2d6e3",accent:"#c2407f",soft:"#fadbe9",red:"#c0392b",redSoft:"#fbe3e0",blue:"#a04a8a",blueSoft:"#f6e0f0",grad:"#ffe0ee,#efe2ff",g:"#e45d9b,#b06ae0",b:"#f08bbb,#c79af0",sh:"140,40,90"},
    {bg:"#1e1218",card:"#2b1a23",ink:"#fae9f1",muted:"#c4a2b3",line:"#442a37",accent:"#f29cc6",soft:"#4a2639",red:"#f08a80",redSoft:"#3d2222",blue:"#e8a8d8",blueSoft:"#45253f",grad:"#4d2539,#3a254d",onAccent:"#28121d"}],
  laranja:["Pôr do sol","#c4622d",
    {bg:"#fdf3ec",card:"#ffffff",ink:"#3a2418",muted:"#8f7262",line:"#f0dccd",accent:"#c4622d",soft:"#fbe5d6",red:"#b8323a",redSoft:"#fbe0e2",blue:"#a8602e",blueSoft:"#fbe8da",grad:"#ffe6d3,#ffe0e6",g:"#f08a3c,#e8557a",b:"#f5a76a,#f08aa0",sh:"130,70,30"},
    {bg:"#1d1510",card:"#2a1f18",ink:"#f9ece3",muted:"#c4a898",line:"#433226",accent:"#f2a172",soft:"#4a2e1f",red:"#f08a90",redSoft:"#3d2224",blue:"#f2b98c",blueSoft:"#43301f",grad:"#4a2e1f,#4a2230",onAccent:"#2a1609"}],
  grafite:["Grafite","#3d4a5c",
    {bg:"#f2f3f5",card:"#ffffff",ink:"#1e2329",muted:"#6b727c",line:"#dde0e5",accent:"#3d4a5c",soft:"#e3e6eb",red:"#c0392b",redSoft:"#fbe3e0",blue:"#3d5a80",blueSoft:"#e2e8f0",grad:"#e6e9ee,#eef0f3",g:"#4b5a70,#6f8299",b:"#7d8ba0,#a3b0c2",sh:"20,30,45"},
    {bg:"#121417",card:"#1c1f24",ink:"#eceef1",muted:"#a3a9b2",line:"#2e333a",accent:"#b9c4d4",soft:"#2b3038",red:"#f08a80",redSoft:"#3d2222",blue:"#a9bdd8",blueSoft:"#263040",grad:"#262b33,#2d3138",onAccent:"#14171b"}]
};
const KEY_TEMA="financas-tema";
function temaAtual(){let t={};try{t=JSON.parse(localStorage.getItem(KEY_TEMA)||"{}")||{};}catch(e){}return{cor:TEMAS[t.cor]?t.cor:"lilas",modo:["auto","claro","escuro"].includes(t.modo)?t.modo:"auto",bicho:t.bicho||"unicornio"};}
function varsTema(v,claro){
  const [g1,g2]=(v.g||claro.g).split(","),[b1,b2]=(v.b||claro.b).split(","),[r1,r2]=v.grad.split(",");
  return "--bg:"+v.bg+";--card:"+v.card+";--ink:"+v.ink+";--muted:"+v.muted+";--line:"+v.line+";--accent:"+v.accent+";--accent-soft:"+v.soft

const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmtDataAno=ds=>{const[y,m,d]=ds.split("-");return d+"/"+m+"/"+y.slice(2);};
function marca(txt,q){ // destaca o termo buscado
  txt=String(txt??"");if(!q)return esc(txt);
  const n=norm(txt),i=n.indexOf(q);
  if(i<0||n.length!==txt.length)return esc(txt);
  return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length));
}

// ---------- Estado ----------
const S={items:new Map(),month:monthOf(todayStr()),tab:"mes",open:{},loaded:false,mode:"init",note:"",busca:"",buscaTodos:true};
let store=null; // {set(obj), del(id)}

const all=kind=>[...S.items.values()].filter(o=>o.kind===kind);
const cards=()=>all("card").sort((a,b)=>a.nome.localeCompare(b.nome));
const cardById=id=>{const o=S.items.get(id);return o&&o.kind==="card"?o:null;};

// mês da fatura em que a compra cai (mês de vencimento)
function faturaMes(ds,card){
  const[y,m,d]=ds.split("-").map(Number);
  const fech=Number(card.fechamento)||1, venc=Number(card.vencimento)||10;
  let cm=d>=fech?m+1:m;            // mês em que a fatura fecha
  let due=venc>fech?cm:cm+1;       // mês em que vence
  return mk(y,due);
}
// expande um lançamento em parcelas {mes,valor,i,n,tx}
function expand(tx){
  const n=Math.max(1,Number(tx.parcelas)||1);
  const k=Math.min(n-1,Math.max(0,Number(tx.jaPagas)||0)); // parcelas pagas antes de usar o app
  const card=tx.metodo==="cartao"?cardById(tx.cardId):null;
  // sem parcelas pagas: data = compra; com parcelas pagas: data = vencimento da próxima parcela
  const prox=k>0?monthOf(tx.data):(card?faturaMes(tx.data,card):monthOf(tx.data));
  const tc=Math.round(tx.valor*100), base=Math.floor(tc/n);
  const out=[],ant=tx.antecipadas||[],dsc=tx.descontos||{};
  for(let i=k;i<n;i++){
    const c=i===n-1?tc-base*(n-1):base,mes=addM(prox,i-k);
    if(ant.includes(mes))continue; // parcela antecipada
    const temD=dsc[mes]!=null&&!isNaN(Number(dsc[mes]));
    out.push({mes,valor:temD?Number(dsc[mes]):c/100,orig:c/100,desc:temD,i:i+1,n,tx,card});
  }
  return out;
}
const CAT_JUROS="Juros e multas",CAT_COFRE="Cofrinho";
function jurosTx(p){return p.tx.tipo!=="entrada"&&p.i===(Math.min(p.n-1,Number(p.tx.jaPagas)||0)+1)?(Number(p.tx.juros)||0):0;}
function jurosFixa(f,mes){return (f.juros&&Number(f.juros[mes]))||0;}
function fixaAtiva(f,mes){return f.inicio<=mes&&(!f.fim||mes<=f.fim);}
function fixaValor(f,mes){return f.valores&&f.valores[mes]!=null?f.valores[mes]:f.valor;}

// ---------- Período (por mês ou do dia de pagamento até a véspera dele) ----------
function modoPeriodo(){return cfg().visao==="periodo";}
function diaIni(){return modoPeriodo()?Math.min(28,Math.max(1,Number(cfg().diaPag)||1)):1;}
const diasNoMes=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate();};
const dataDe=(m,dia)=>m+"-"+String(Math.min(Math.max(1,Number(dia)||1),diasNoMes(m))).padStart(2,"0");
function perDe(m,dia){return Number(dia)>=diaIni()?m:addM(m,-1);}
const perData=ds=>perDe(monthOf(ds),Number(ds.slice(8)));
const perHoje=()=>perData(todayStr());
function perFim(P){const D=diaIni();return D>1?dataDe(addM(P,1),D-1):dataDe(P,31);}
function nomePer(P){const D=diaIni();if(D<=1)return nomeMes(P);
  const[y,m]=P.split("-").map(Number),[y2,m2]=addM(P,1).split("-").map(Number),ano=new Date().getFullYear();
  return D+"/"+MES_C[m-1]+" a "+(D-1)+"/"+MES_C[m2-1]+(y2!==ano?" de "+y2:"");}
const pago=(o,m)=>(o.pagas||[]).includes(m);
const pagoParte=(o,m)=>Math.round(((o.parciais&&o.parciais[m])||[]).reduce((a,x)=>a+x.valor,0)*100)/100;
const resta=(o,m,v)=>Math.max(0,Math.round((v-pagoParte(o,m))*100)/100);
const diaTx=t=>Number(t.data.slice(8));
const ehEmprestimo=c=>c&&c.tipo==="emprestimo";
function diaVencTx(t){const c=t.metodo==="cartao"?cardById(t.cardId):null;
  if(c&&!ehEmprestimo(c))return Number(c.vencimento);
  if(c)return Number(t.diaVenc)||((Number(t.jaPagas)||0)>0?diaTx(t):Number(c.vencimento));
  return diaTx(t);}
const diaVencP=p=>diaVencTx(p.tx);
const vencP=p=>dataDe(p.mes,diaVencP(p));
const empP=p=>!!(p.card&&ehEmprestimo(p.card));
const baixaP=p=>p.tx.tipo!=="entrada"&&(COM_BAIXA(p.tx.metodo)||empP(p)); // parcela com baixa própria
const fixaNoCartao=f=>f.tipo!=="entrada"&&f.metodo==="cartao"?cardById(f.cardId):null;
function cobrancasFixa(f,c,FMs){ // conta fixa no cartão vira item da fatura que vence em FM
  const out=[];
  FMs.forEach(FM=>{for(let k=2;k>=0;k--){const m=addM(FM,-k);if(!fixaAtiva(f,m))continue;const ds=dataDe(m,f.dia);
    if(faturaMes(ds,c)===FM)out.push({mes:FM,valor:fixaValor(f,m),i:1,n:1,card:c,fixa:f,m,tx:{id:f.id,tipo:"saida",desc:f.desc,categoria:f.categoria,data:ds,metodo:"cartao",cardId:c.id}});}});
  return out;
}
function faturaTotal(c,m){let s=0;
  all("tx").forEach(t=>{if(t.cardId!==c.id||t.tipo==="entrada")return;expand(t).forEach(p=>{if(p.mes===m)s+=p.valor;});});
  all("fixa").forEach(f=>{const cc=fixaNoCartao(f);if(cc&&cc.id===c.id)cobrancasFixa(f,c,[m]).forEach(p=>{s+=p.valor;});});
  return Math.round(s*100)/100;}

function calcMes(P){
  const D=diaIni(),meses=D>1?[P,addM(P,1)]:[P],noPer=(m,dia)=>meses.includes(m)&&perDe(m,dia)===P;
  const parcelas=[];
  all("tx").forEach(t=>expand(t).forEach(p=>{if(noPer(p.mes,diaVencP(p)))parcelas.push(p);}));
  all("fixa").forEach(f=>{const c=fixaNoCartao(f);if(c)cobrancasFixa(f,c,meses).forEach(p=>{if(noPer(p.mes,c.vencimento))parcelas.push(p);});});
  let entradas=0,saidas=0,falta=0,juros=0,guardado=0,retirado=0,pai=0;const porCat={},cofre=[],antecip=[];
  const addCat=(c,v)=>{porCat[c]=(porCat[c]||0)+v;};
  parcelas.forEach(p=>{
    if(p.tx.tipo==="entrada"){entradas+=p.valor;return;}
    const j=jurosTx(p);
    saidas+=p.valor+j;addCat(p.tx.categoria||"Outros",p.valor);if(j){juros+=j;addCat(CAT_JUROS,j);}
    if(p.tx.metodo==="pai")pai+=p.valor+j;
    else if(baixaP(p)&&!pago(p.tx,p.mes))falta+=resta(p.tx,p.mes,p.valor+j);
  });
  const fixas=[];
  all("fixa").forEach(f=>meses.forEach(m=>{if(fixaAtiva(f,m)&&noPer(m,f.dia))fixas.push({f,m,v:fixaValor(f,m),j:jurosFixa(f,m)});}));
  fixas.forEach(x=>{const f=x.f;
    if(f.tipo==="entrada"){entradas+=x.v;return;}
    if(fixaNoCartao(f))return; // entra pela fatura
    saidas+=x.v+x.j;addCat(f.categoria||"Outros",x.v);if(x.j){juros+=x.j;addCat(CAT_JUROS,x.j);}
    if(f.metodo==="pai")pai+=x.v+x.j;else if(!pago(f,x.m))falta+=resta(f,x.m,x.v+x.j);
  });
  all("meta").forEach(m=>(m.depositos||[]).forEach(d=>{
    if(perData(d.data)!==P)return;cofre.push({m,d});
    if(d.valor>=0){saidas+=d.valor;guardado+=d.valor;addCat(CAT_COFRE,d.valor);}
    else{entradas+=-d.valor;retirado+=-d.valor;}
  }));
  cards().forEach(c=>(c.antecipacoes||[]).forEach(a=>{if(perData(a.data)!==P)return;antecip.push({c,a});saidas+=a.valor;addCat(a.categoria||"Outros",a.valor);}));
  const faturas=[];
  cards().filter(c=>!ehEmprestimo(c)).forEach(c=>meses.forEach(m=>{if(!noPer(m,c.vencimento))return;
    const ps=parcelas.filter(p=>p.card&&p.card.id===c.id&&p.mes===m&&p.tx.tipo!=="entrada");if(!ps.length)return;
    const total=Math.round(ps.reduce((a,p)=>a+p.valor,0)*100)/100,paga=pago(c,m);
    if(!paga)falta+=resta(c,m,total);
    faturas.push({card:c,m,ps,total,paga});
  }));
  return{entradas,saidas,sobra:entradas-saidas,falta,porCat,parcelas,fixas,faturas,juros,guardado,retirado,cofre,pai,antecip};
}

function cfg(){return Object.assign({diaPag:10,lemDia:8,lemHora:"09:00",visao:"mes"},S.items.get("config")||{});}
function pendentes(P){
  const r=calcMes(P),it=[];
  r.fixas.forEach(x=>{const f=x.f;if(f.tipo==="entrada"||fixaNoCartao(f)||f.metodo==="pai"||pago(f,x.m))return;
    it.push({t:"fixa",o:f,m:x.m,nome:f.desc,total:x.v+x.j,dia:f.dia});});
  r.faturas.filter(f=>!f.paga&&f.total>0).forEach(f=>it.push({t:"fat",o:f.card,m:f.m,nome:(ehEmprestimo(f.card)?"Parcela ":"Fatura ")+f.card.nome,total:f.total,dia:f.card.vencimento}));
  const grp={};
  r.parcelas.filter(p=>empP(p)&&!pago(p.tx,p.mes)).forEach(p=>{const g=grp[p.card.id]=grp[p.card.id]||{t:"emp",o:p.card,m:P,nome:p.card.nome,itens:[]};g.itens.push(p);});
  r.parcelas.filter(p=>baixaP(p)&&!empP(p)&&!pago(p.tx,p.mes)).forEach(p=>it.push({t:"bol",o:p.tx,m:p.mes,nome:(empP(p)&&!norm(p.tx.desc).includes(norm(p.card.nome))?p.card.nome+" · ":"")+(p.tx.desc||p.tx.categoria)+(p.n>1?" ("+p.i+"/"+p.n+")":""),total:p.valor+jurosTx(p),dia:diaVencP(p)}));
  it.forEach(x=>{x.parte=pagoParte(x.o,x.m);x.v=resta(x.o,x.m,x.total);x.venc=dataDe(x.m,x.dia);});
  Object.values(grp).forEach(g=>{g.itens.sort((a,b)=>vencP(a).localeCompare(vencP(b)));g.total=g.itens.reduce((a,p)=>a+p.valor+jurosTx(p),0);
    g.v=Math.round(g.itens.reduce((a,p)=>a+resta(p.tx,p.mes,p.valor+jurosTx(p)),0)*100)/100;g.parte=Math.round((g.total-g.v)*100)/100;
    g.venc=vencP(g.itens[0]);g.k=g.itens.map(p=>p.tx.id+"|"+p.mes).join(",");it.push(g);});
  return it.sort((a,b)=>a.venc.localeCompare(b.venc));
}
function atrasadas(P){
  const out=[];
  for(let k=12;k>=1;k--){const q=addM(P,-k);pendentes(q).forEach(x=>out.push(Object.assign({per:q},x)));}
  return out;
}

function paiAPagar(P){return temPai()?Math.max(0,saldoPai(P)):0;}
function payCard(P){
  const it=pendentes(P),at=atrasadas(P),paiV=paiAPagar(P);if(!it.length&&!at.length&&!paiV)return"";
  const per=modoPeriodo(),P0=perHoje(),c=cfg(),totM=it.reduce((a,x)=>a+x.v,0)+paiV,totA=at.reduce((a,x)=>a+x.v,0),tot=totM+totA,hoje=todayStr(),dia=Number(hoje.slice(8));
  let tit,late=false;

  else{tit="Passou do dia "+c.diaPag+" e ainda falta pagar";late=true;}
  let h='<div class="paycard'+(late?" late":"")+'"><div class="hd"><span style="font-weight:650">'+tit+'</span><b class="'+(late?"neg":"pos")+'">'+fmt(tot)+'</b></div>';
  if(it.length||paiV)h+=(at.length?'<div style="font-size:12px;font-weight:650;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.05em">'+(per?"Deste período":"Deste mês")+' · '+fmt(totM)+'</div>':'')+'<ul>'+it.map(itemLi).join("")+(paiV?paiLi(paiV):'')+'</ul>';
  if(at.length){
    const grupos={};at.forEach(x=>{(grupos[x.per]=grupos[x.per]||[]).push(x);});
    h+='<div style="font-size:12px;font-weight:650;color:var(--red);margin-top:10px;text-transform:uppercase;letter-spacing:.05em">Em aberto de '+(per?"períodos":"meses")+' anteriores · '+fmt(totA)+'</div>';

   +'<button class="btn" style="margin-top:10px" data-a="pagar-tudo">'+(S.confirmPagar?"Toque de novo para confirmar ("+q+" contas)":"✓ Já paguei tudo")+'</button></div>';

async function pagarTudo(){
  const P=S.month,lista=pendentes(P).concat(atrasadas(P)),pv=paiAPagar(P);
  for(const x of lista){
    if(x.t==="emp"){for(const p of x.itens){const o=S.items.get(p.tx.id);if(o&&!pago(o,p.mes))await store.set(Object.assign({},o,{pagas:(o.pagas||[]).concat([p.mes])}));}continue;}
    const o=S.items.get(x.o.id);if(o&&!pago(o,x.m))await store.set(Object.assign({},o,{pagas:(o.pagas||[]).concat([x.m])}));}
  if(pv>0)await addRepasse(pv,P===perHoje()?todayStr():dataDe(P,diaIni()),"acerto");
  S.confirmPagar=false;render();toast("Tudo pago! 🦄");
}

// ---------- Saldo nas contas (o que entrou menos o que foi pago de verdade) ----------
function caixaPer(P,hoje){
  const r=calcMes(P);let ent=0,sai=0;
  r.parcelas.forEach(p=>{const t=p.tx;
    if(t.tipo==="entrada"){if(t.data<=hoje)ent+=p.valor;return;}
    if(t.metodo==="pai")return;            // conta do pai: sai pelo "Paguei ao pai"
    if(p.card&&!empP(p))return;            // cartão: sai quando paga a fatura
    const v=p.valor+jurosTx(p);
    if(baixaP(p))sai+=pago(t,p.mes)?v:pagoParte(t,p.mes);
    else if(t.data<=hoje)sai+=v;           // Pix, débito, dinheiro: saiu na data
  });
  r.fixas.forEach(x=>{const f=x.f;
    if(f.tipo==="entrada"){if(pago(f,x.m))ent+=x.v;return;}
    if(fixaNoCartao(f)||f.metodo==="pai")return;
    sai+=pago(f,x.m)?x.v+x.j:pagoParte(f,x.m);});
  r.faturas.forEach(f=>{sai+=f.paga?f.total:pagoParte(f.card,f.m);});
  r.cofre.forEach(({d})=>{if(d.data<=hoje){if(d.valor>=0)sai+=d.valor;else ent+=-d.valor;}});
  r.antecip.forEach(({a})=>{if(a.data<=hoje)sai+=a.valor;});
  repassesPer(P).forEach(x=>{if(x.data<=hoje)sai+=x.valor;});
  return ent-sai;
}
let _sb={items:null,v:0,dia:""};
function saldoBruto(){
  const hoje=todayStr();if(_sb.items===S.items&&_sb.dia===hoje)return _sb.v;
  let ini=perHoje();const ver=d=>{if(d){const m=String(d).slice(0,7);if(m<ini)ini=m;}};
  all("tx").forEach(t=>ver(t.data));all("fixa").forEach(f=>ver(f.inicio));
  all("meta").forEach(m=>(m.depositos||[]).forEach(d=>ver(d.data)));(paiObj().repasses||[]).forEach(x=>ver(x.data));
  cards().forEach(c=>(c.antecipacoes||[]).forEach(a=>ver(a.data)));
  let v=0;const fim=addM(perHoje(),24);
  for(let P=addM(ini,-1);P<=fim;P=addM(P,1))v+=caixaPer(P,hoje);
  _sb={items:S.items,v:Math.round(v*100)/100,dia:hoje};return _sb.v;
}

function agendaLink(){

  const fimH=String((Number(hh)+1)%24).padStart(2,"0"),fim=ano+String(mm).padStart(2,"0")+dd+"T"+fimH+mi+"00";

// ---------- Personagem (unicórnio e amigos) ----------
function humor(r){
  if(r.entradas<=0&&r.saidas<=0)return{k:"dorme",t:"Cochilando",m:"Nada lançado neste mês ainda. Me acorda quando entrar alguma coisa!"};
  if(r.entradas<=0)return{k:"desespero",t:"Socorro!",m:"Tem saída e nenhuma entrada lançada neste mês."};
  const p=(r.sobra+(r.guardado||0))/r.entradas; // o que vai pro cofrinho não deixa o unicórnio triste
  if(p<0)return{k:"desespero",t:"Socorro!",m:"As saídas passaram as entradas. Bora rever os gastos?"};
  if(p<0.05)return{k:"triste",t:"Tristinho",m:"Tá quase no limite: sobra menos de 5% do que entrou."};
  if(p<0.15)return{k:"atento",t:"De olho",m:"Ainda sobra, mas tá apertando. Vai com calma."};
  if(p<0.30)return{k:"feliz",t:"Feliz",m:"Tá sobrando um dinheirinho. Muito bem!"};
  return{k:"radiante",t:"Radiante!",m:"Sobrando 30% ou mais do que entrou. Arrasou!"};
}

  if(r.faturas.length){

function metaInfo(m){

  const alvo=Number(m.alvo)||0,falta=alvo>0?Math.max(0,alvo-guard):0,pct=alvo>0?Math.min(100,guard/alvo*100):0;

  if(alvo>0&&m.prazo&&falta>0){const now=monthOf(todayStr());const[a,b]=now.split("-").map(Number),[c,d]=m.prazo.split("-").map(Number);meses=(c-a)*12+(d-b)+1;if(meses>=1)porMes=falta/meses;}

  return{guard,alvo,falta,pct,porMes,meses,noMes};
}

   +(F.err?'<div class="err">'+esc(F.err)+'</div>':'')

function readMeta(){const g=id=>document.getElementById(id);if(g("mn"))F.t.nome=g("mn").value;if(g("ma"))F.valStr=g("ma").value;if(g("mp"))F.t.prazo=g("mp").value||"";

async function saveDep(){
  const m=S.items.get(F.id);if(!m)return closeSheet();
  const v=parseMoney(document.getElementById("dv").value),d=document.getElementById("dd").value||todayStr(),n=document.getElementById("dn").value.trim();
  if(isNaN(v)||v<=0){document.getElementById("derr").innerHTML='<div class="err">Digite um valor maior que zero.</div>';return;}
  const antes=metaInfo(m).falta>0, sinal=F.sinal;
  const o=Object.assign({},m,{depositos:(m.depositos||[]).concat([{id:uid(),data:d,valor:sinal*v,nota:n}])});
  closeSheet();await store.set(o);
  if(sinal>0&&metaInfo(m).alvo>0&&antes&&metaInfo(o).falta<=0)celebrar(o);else toast(sinal>0?"Guardado! 💜":"Retirada registrada");
}
function celebrar(m){
  openSheet('<div style="text-align:center;padding:10px 0"><div style="width:160px;height:160px;margin:0 auto">'+unicornio("radiante")+'</div><h3 style="justify-content:center;font-size:22px;margin:10px 0 4px">Meta batida! 🎉</h3><p style="color:var(--muted);margin:0 0 6px">Você juntou '+fmt(metaInfo(m).guard)+' para '+esc(m.nome)+'.</p><button class="btn" data-a="close">Uhuul!</button></div>');
  F={type:"celebra"};
}

function limiteUsado(card,excluir){
  let u=0;
  all("tx").forEach(t=>{if(t.cardId!==card.id||t.tipo==="entrada"||t.id===excluir)return;
    expand(t).forEach(p=>{if(!(empP(p)?pago(t,p.mes):pago(card,p.mes)))u+=p.valor;});});
  const fm=faturaMes(todayStr(),card);
  all("fixa").forEach(f=>{const cc=fixaNoCartao(f);if(!cc||cc.id!==card.id)return;
    for(let k=12;k>=0;k--){const FM=addM(fm,-k);if(!pago(card,FM))cobrancasFixa(f,card,[FM]).forEach(p=>{u+=p.valor;});}});
  return Math.round(u*100)/100;
}
// quanto do limite de empréstimo está em uso (o valor que você pegou, sem os juros, das parcelas que faltam)
function principalAberto(c){
  let s=0;
  all("tx").forEach(t=>{if(t.cardId!==c.id||t.tipo==="entrada")return;const base=Number(t.pego)>0?Number(t.pego):t.valor;
    expand(t).forEach(p=>{if(!pago(t,p.mes))s+=p.valor/t.valor*base;});});
  return Math.round(s*100)/100;
}
function parcelasAbertas(c){
  const out=[];
  all("tx").forEach(t=>{if(t.cardId!==c.id||t.tipo==="entrada")return;expand(t).forEach(p=>{if(!pago(t,p.mes))out.push(p);});});
  return out.sort((a,b)=>a.mes.localeCompare(b.mes)||(a.tx.desc||"").localeCompare(b.tx.desc||""));
}
function taxaMes(pego,parc,n){
  if(!(pego>0)||!(parc>0))return null;if(n<=1)return parc/pego-1;if(parc*n<=pego)return 0;
  let lo=0,hi=2;for(let k=0;k<80;k++){const i=(lo+hi)/2,pv=parc*(1-Math.pow(1+i,-n))/i;if(pv>pego)lo=i;else hi=i;}
  return (lo+hi)/2;
}
function jurosInfo(pego,total,n){
  const j=total-pego,i=taxaMes(pego,total/n,n);
  if(j<=0.005)return 'Sem juros: você vai pagar o mesmo valor que pegou.';
  return 'Você pegou <b>'+fmt(pego)+'</b> e vai pagar <b>'+fmt(total)+'</b>: são <b>'+fmt(j)+' de juros</b> ('+Math.round(j/pego*100)+'% a mais'
    +(i!=null&&n>1?' · cerca de '+(i*100).toFixed(1).replace(".",",")+'% ao mês':'')+').'
    +(i>0.05?'<br>⚠️ Juros alto, acima de 5% ao mês. Se sobrar dinheiro, vale antecipar parcelas para ganhar desconto.':'');
}
function cardEmprestimo(c){
  const deve=limiteUsado(c),princ=principalAberto(c),lim=Number(c.limite)||0,disp=lim>0?Math.round((lim-princ)*100)/100:null;
  const txs=all("tx").filter(t=>t.cardId===c.id&&t.tipo!=="entrada"),abertas=parcelasAbertas(c);
  let jurosAb=0,semPego=0;
  txs.forEach(t=>{const ab=expand(t).filter(p=>!pago(t,p.mes)).reduce((a,p)=>a+p.valor,0);if(!ab)return;
    if(Number(t.pego)>0)jurosAb+=ab*(1-t.pego/t.valor);else semPego++;});
  const pct=lim>0?Math.min(100,Math.max(0,disp/lim*100)):0;
  let h='<div class="meta"><button class="top" data-a="edit-card" data-id="'+c.id+'" style="border:0;background:none;padding:0;width:100%;text-align:left"><span class="emo">💸</span><span style="flex:1;min-width:0"><span class="t" style="display:block;font-weight:650">'+esc(c.nome)+'</span><span class="s" style="font-size:12px;color:var(--muted)">empréstimo · cada empréstimo tem o seu dia de vencimento</span></span><span class="s" style="font-size:12px;color:var(--muted)">editar</span></button>';
  if(disp!=null)h+='<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><span>Disponível para empréstimo</span><b class="'+(disp<0?"neg":"pos")+'">'+fmt(disp)+'</b></div>'
    +'<div class="bar"><i style="width:'+pct+'%;background:linear-gradient(90deg,var(--b1),var(--b2))"></i></div>'
    +'<div class="s" style="font-size:12px;color:var(--muted)">Limite '+fmt(lim)+' · em uso '+fmt(princ)+(c.dispData?' · conferido com o app em '+fmtDataAno(c.dispData):'')+'</div>';
  else h+='<div class="hint">Toque em "Atualizar disponível" e coloque o valor disponível que aparece no app.</div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><span>Você deve (com juros)</span><b>'+fmt(deve)+'</b></div>'
    +(abertas.length?'<div class="s" style="font-size:12px;color:var(--muted)">'+abertas.length+' parcela(s) em aberto · última em '+nomeMes(abertas[abertas.length-1].mes)+'</div>':'')
    +(jurosAb>0.005?'<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:14px"><span>Desse total, é juros'+(semPego?'*':'')+'</span><b class="neg">'+fmt(jurosAb)+'</b></div>':'')
    +(semPego?'<div class="s" style="font-size:12px;color:var(--muted);margin-top:4px">'+(jurosAb>0.005?'* ':'')+semPego+' empréstimo(s) sem o valor que você pegou. Abra cada um e preencha "Quanto você pegou" para ver os juros.</div>':'');
  const ants=(c.antecipacoes||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
  let eco=ants.reduce((a,x)=>a+(x.original-x.valor),0);
  txs.forEach(t=>{const n=Math.max(1,Number(t.parcelas)||1);Object.values(t.descontos||{}).forEach(v=>{eco+=t.valor/n-Number(v);});});
  if(eco>0.005)h+='<div class="done" style="margin-top:8px">🎉 Você já economizou '+fmt(eco)+' com descontos</div>';
  h+='<div class="acts"><button data-a="disp-card" data-id="'+c.id+'">Atualizar disponível</button><button class="pri" data-a="antecipar" data-id="'+c.id+'">Antecipar parcelas</button></div>';
  if(ants.length)h+='<div class="list" style="margin-top:10px">'+ants.map(a=>'<button class="row" data-a="ver-antecip" data-id="'+c.id+'" data-v="'+a.id+'"><div class="main"><div class="t">Antecipação · '+a.itens.length+' parcela(s)</div><div class="s">'+fmtDataAno(a.data)+' · economizou '+fmt(a.original-a.valor)+'</div></div><div class="v">'+fmt(a.valor)+'</div></button>').join("")+'</div>';
  return h+'</div>';
}
function viewCartoes(){
  const cs=cards().filter(c=>!ehEmprestimo(c)),es=cards().filter(ehEmprestimo);
  let h='<section><h2>Seus cartões <button class="btn small" data-a="new-card">+ Novo</button></h2><div class="list">';
  if(!cs.length)h+='<div class="empty">Cadastre seu cartão com o dia de fechamento e o de vencimento. Assim cada parcela cai sozinha na fatura certa.</div>';
  cs.forEach(c=>{
    let lim='';
    if(c.limite>0){const u=limiteUsado(c),d=c.limite-u,pct=Math.min(100,Math.max(0,u/c.limite*100));
      lim='<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:14px"><span>Disponível</span><b class="'+(d<0?"neg":"pos")+'">'+fmt(d)+'</b></div>'
        +'<div class="bar"><i style="width:'+pct+'%;background:'+(pct>=90?"var(--red)":"linear-gradient(90deg,var(--b1),var(--b2))")+'"></i></div>'
        +'<div class="s">Usado '+fmt(u)+' de '+fmt(c.limite)+(d<0?' · <span class="neg">passou do limite</span>':pct>=90?' · <span class="neg">quase no limite</span>':'')+'</div>';}
    else lim='<div class="s" style="margin-top:4px">Toque para informar o limite</div>';
    const nf=all("fixa").filter(f=>{const cc=fixaNoCartao(f);return cc&&cc.id===c.id;}).length;
    h+='<button class="row" data-a="edit-card" data-id="'+c.id+'" style="display:block"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">💳</span><div class="main"><div class="t">'+esc(c.nome)+'</div><div class="s">fecha dia '+c.fechamento+' · vence dia '+c.vencimento+(nf?' · '+nf+' conta(s) fixa(s)':'')+'</div></div><span class="s">editar</span></div>'+lim+'</button>';
  });
  h+='</div></section>';
  if(es.length)h+='<section><h2>Empréstimos</h2>'+es.map(cardEmprestimo).join("")+'</section>';
  h+='<div class="banner">O limite volta quando você marca a fatura como paga. Fatura de mês anterior sem baixa continua ocupando o limite (e aparece como em aberto no mês atual). Compra parcelada ocupa o valor total e vai liberando a cada fatura paga, igual ao banco.</div><div class="banner">Como funciona: compra feita <b>no dia do fechamento ou depois</b> vai para a fatura seguinte. Cada parcela aparece no mês em que a fatura <b>vence</b>.</div>'
   +'<div class="banner">Tem empréstimo (como o da Shopee)? Toque em <b>+ Novo</b> e escolha <b>Empréstimo</b>. Ele não fica vermelho de limite e mostra quanto você ainda tem disponível para pegar.</div>';
  return h;
}

// ----- Antecipar parcelas -----
const antKey=p=>p.tx.id+"|"+p.mes;
function antForm(c){F={type:"antecip",id:c.id,sel:[],valStr:"",data:todayStr(),err:""};drawAnt();}
function antOrig(){const c=S.items.get(F.id);return Math.round(parcelasAbertas(c).filter(p=>F.sel.includes(antKey(p))).reduce((a,p)=>a+p.valor,0)*100)/100;}
function drawAnt(){
  const c=S.items.get(F.id),ps=parcelasAbertas(c);
  F.sel=F.sel.filter(k=>ps.some(p=>antKey(p)===k));
  let h='<h3>Antecipar no '+esc(c.nome)+'<button class="x" data-a="close">×</button></h3>'
   +'<label class="f">Quais parcelas você vai pagar adiantado?</label>'
   +'<div style="display:flex;gap:8px;margin-bottom:8px"><button class="chip" data-a="ant-todas">Selecionar todas</button><button class="chip" data-a="ant-nenhuma">Limpar</button></div>'
   +'<div class="list">'+(ps.length?ps.map(p=>{const on=F.sel.includes(antKey(p));
      return '<button class="row" data-a="ant-sel" data-v="'+antKey(p)+'"><span class="check '+(on?"on":"")+'">'+(on?"✓":"")+'</span><div class="main"><div class="t">'+esc(p.tx.desc||p.tx.categoria)+(p.n>1?'<span class="badge">'+p.i+'/'+p.n+'</span>':'')+'</div><div class="s">vence em '+nomeMes(p.mes)+'</div></div><div class="v">'+fmt(p.valor)+'</div></button>';}).join("")
      :'<div class="empty">Nenhuma parcela em aberto.</div>')+'</div>'
   +'<div class="hint" style="margin-top:10px">Selecionado: <b>'+F.sel.length+' parcela(s) · '+fmt(antOrig())+'</b></div>'
   +'<label class="f">Quanto você vai pagar de verdade (já com o desconto)</label><input class="inp money money-in" id="antv" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off" value="'+esc(F.valStr)+'">'
   +'<label class="f">Data do pagamento</label><input class="inp" type="date" id="antd" value="'+esc(F.data)+'">'
   +'<div id="antres"></div>'+(F.err?'<div class="err">'+esc(F.err)+'</div>':'')
   +'<button class="btn" data-a="save-antecip">Confirmar antecipação</button>';
  openSheet(h);antRes();
}
function readAnt(){const v=document.getElementById("antv"),d=document.getElementById("antd");if(v)F.valStr=v.value;if(d&&d.value)F.data=d.value;}
function antRes(){
  const el=document.getElementById("antres");if(!el||!F||F.type!=="antecip")return;
  const orig=antOrig(),v=parseMoney(F.valStr);
  el.innerHTML=(!isNaN(v)&&v>0&&orig>0)?(v<orig?'<div class="hint" style="background:var(--accent-soft);color:var(--accent)">Desconto de <b>'+fmt(orig-v)+'</b> ('+Math.round((orig-v)/orig*100)+'% a menos) 🎉</div>'
    :'<div class="hint">Sem desconto: o valor é igual ou maior que o das parcelas.</div>'):'';
}
async function saveAntecip(){
  readAnt();
  const c=S.items.get(F.id),sel=parcelasAbertas(c).filter(p=>F.sel.includes(antKey(p))),v=parseMoney(F.valStr);
  if(!sel.length){F.err="Selecione pelo menos uma parcela.";drawAnt();return;}
  if(isNaN(v)||v<=0){F.err="Digite quanto você vai pagar.";drawAnt();return;}
  const orig=Math.round(sel.reduce((a,p)=>a+p.valor,0)*100)/100,data=F.data||todayStr();
  const porTx={};sel.forEach(p=>{(porTx[p.tx.id]=porTx[p.tx.id]||[]).push(p.mes);});
  const a={id:uid(),data,valor:v,original:orig,categoria:sel[0].tx.categoria||"Outros",itens:sel.map(p=>({tx:p.tx.id,mes:p.mes,valor:p.valor,desc:p.tx.desc||p.tx.categoria,i:p.i,n:p.n}))};
  closeSheet();
  for(const id in porTx){const t=S.items.get(id);if(t)await store.set(Object.assign({},t,{antecipadas:(t.antecipadas||[]).concat(porTx[id])}));}
  const c2=S.items.get(c.id);await store.set(Object.assign({},c2,{antecipacoes:(c2.antecipacoes||[]).concat([a])}));
  const eco=orig-v;
  F={type:"msg"};
  openSheet('<div style="text-align:center;padding:10px 0"><div style="width:150px;height:150px;margin:0 auto">'+unicornio(eco>0.005?"radiante":"feliz")+'</div><h3 style="justify-content:center;font-size:21px;margin:10px 0 4px">'+(eco>0.005?'Você economizou '+fmt(eco)+'! 🎉':'Antecipação registrada')+'</h3>'
    +'<p style="color:var(--muted);margin:0 0 6px">'+sel.length+' parcela(s) quitada(s) por '+fmt(v)+'. O valor entra nas saídas de '+fmtDataAno(data)+'.</p><button class="btn" data-a="close">Uhuul!</button></div>');
}
function verAntecip(cid,aid){
  const c=S.items.get(cid),a=c&&(c.antecipacoes||[]).find(x=>x.id===aid);if(!a)return;
  F={type:"verant",cid,aid,confirm:false};
  const draw=()=>openSheet('<h3>Antecipação · '+esc(c.nome)+'<button class="x" data-a="close">×</button></h3>'
   +'<div class="tiles" style="margin:0 0 6px"><div class="tile"><small>Valor das parcelas</small><b>'+fmt(a.original)+'</b></div><div class="tile"><small>Você pagou</small><b>'+fmt(a.valor)+'</b></div><div class="tile"><small>Economia</small><b class="pos">'+fmt(a.original-a.valor)+'</b></div></div>'
   +'<label class="f">Parcelas quitadas em '+fmtDataAno(a.data)+'</label><div class="list">'+a.itens.map(x=>'<div class="row"><div class="main"><div class="t">'+esc(x.desc||"")+(x.n>1?'<span class="badge">'+x.i+'/'+x.n+'</span>':'')+'</div><div class="s">vencia em '+nomeMes(x.mes)+'</div></div><div class="v">'+fmt(x.valor)+'</div></div>').join("")+'</div>'
   +'<button class="btn ghost" data-a="del-antecip">'+(F.confirm?"Toque de novo para desfazer":"Desfazer antecipação")+'</button>');
  F.draw=draw;draw();
}
async function delAntecip(){
  const c=S.items.get(F.cid),a=c&&(c.antecipacoes||[]).find(x=>x.id===F.aid);if(!a)return closeSheet();
  closeSheet();

function readTxInputs(){

function txValorTotal(){
  const v=parseMoney(F.valStr);if(isNaN(v))return NaN;

function updatePreview(){
  const el=document.getElementById("prev");if(!el||!F||F.type!=="tx")return;
  const t=F.t,tot=txValorTotal();

    if(!isNaN(tot)&&tot>0&&!isNaN(pg)&&pg>0)limH='<div class="hint">'+jurosInfo(pg,tot,Math.max(1,t.parcelas))+'</div>';}
  else if(cardSel&&cardSel.limite>0){const d=cardSel.limite-limiteUsado(cardSel,t.id),dep=d-(isNaN(tot)?0:expand(Object.assign({},t,{valor:tot})).reduce((a,p)=>a+p.valor,0));

  if(t.tipo==="entrada"||isNaN(tot)||tot<=0){el.innerHTML=limH;return;}

  const ps=expand(tmp);

  const nT=ps[0].n,kP=nT-ps.length;
  if(nT>1&&kP>0)s=nT+'x de '+fmt(ps[0].valor)+' · já pagou '+kP+', faltam <b>'+ps.length+'</b> ('+fmt(ps.reduce((a,p)=>a+p.valor,0))+')<br>'+(kP+1)+'ª parcela em <b>'+nomeMes(ps[0].mes)+'</b>, última em <b>'+nomeMes(ps[ps.length-1].mes)+'</b>';
  else if(ps.length>1)s=ps.length+'x de '+fmt(ps[0].valor)+(ps[ps.length-1].valor!==ps[0].valor?' (última '+fmt(ps[ps.length-1].valor)+')':'')+' · total '+fmt(tot)+'<br>1ª parcela em <b>'+nomeMes(ps[0].mes)+'</b>, última em <b>'+nomeMes(ps[ps.length-1].mes)+'</b>';

  el.innerHTML='<div class="hint">'+s+'</div>'+limH;
}
async function saveTx(){
  readTxInputs();

  if(isNaN(tot)||tot<=0){F.err="Digite um valor maior que zero.";drawTx();return;}
  if(!t.data){F.err="Escolha a data.";drawTx();return;}
  if(t.tipo!=="entrada"&&t.metodo==="cartao"&&!cardById(t.cardId)){F.err="Escolha o cartão.";drawTx();return;}
  const jv=t.tipo==="entrada"?0:(F.jurosStr&&F.jurosStr.trim()?parseMoney(F.jurosStr):0);
  if(isNaN(jv)||jv<0){F.err="Valor de juros inválido.";drawTx();return;}
  const pgv=F.pegoStr&&F.pegoStr.trim()?parseMoney(F.pegoStr):0;
  if(isNaN(pgv)||pgv<0){F.err="Valor que você pegou é inválido.";drawTx();return;}
  const descontos=Object.assign({},t.descontos||{});
  if(t.tipo!=="entrada"&&F.descStr&&F.descStr.trim()){const dv=parseMoney(F.descStr);
    if(isNaN(dv)||dv<0){F.err="Valor pago com desconto inválido.";drawTx();return;}
    const mesD=F.descMes||expand(Object.assign({},t,{valor:tot,descontos:{}}))[0].mes;descontos[mesD]=dv;}
  const o={kind:"tx",id:t.id||uid(),juros:jv,parciais:t.parciais||{},antecipadas:t.antecipadas||[],descontos,pego:ehEmprestimo(t.metodo==="cartao"?cardById(t.cardId):null)?pgv:0,
    diaVenc:ehEmprestimo(t.metodo==="cartao"?cardById(t.cardId):null)?(Math.min(31,Math.max(1,parseInt(F.diaVencStr,10)||0))||null):null,tipo:t.tipo,valor:tot,desc:(t.desc||"").trim(),categoria:t.categoria,
    metodo:t.tipo==="entrada"?"entrada":t.metodo,cardId:t.metodo==="cartao"?t.cardId:null,parcelas:t.parcelas||1,jaPagas:(t.parcelas>1?t.jaPagas||0:0),data:t.data,pagas:t.pagas||[]};
  const novo=!t.id;

}

   +(emp?'<div class="hint" style="margin-top:4px">Não sabe o limite total? Deixe em branco e, depois de salvar, use "Atualizar disponível" com o valor que aparece no app.</div>':'')
   +(F.err?'<div class="err">'+esc(F.err)+'</div>':'')
   +'<button class="btn" data-a="save-card">Salvar</button>'
   +(x.id?'<button class="btn ghost" data-a="del-card">'+(usado?"Este cartão tem compras e não pode ser apagado":(F.confirmDel?"Toque de novo para apagar":"Apagar cartão"))+'</button>':''));
}
function readCard(){const g=id=>{const e=document.getElementById(id);return e?e.value:"";};const x=F.t;x.nome=g("cn");x.fechamento=g("cf");x.vencimento=g("cv");x.limStr=g("cl");}
async function saveCard(){
  readCard();const x=F.t;x.nome=x.nome.trim();const fe=parseInt(x.fechamento,10),ve=parseInt(x.vencimento,10);
  const lim=x.limStr.trim()?parseMoney(x.limStr):0;
  if(isNaN(lim)||lim<0){F.err="Limite inválido.";drawCard();return;}
  if(!x.nome){F.err="Dê um nome ao cartão.";drawCard();return;}
  if(!(fe>=1&&fe<=31)||!(ve>=1&&ve<=31)){F.err="Os dias precisam estar entre 1 e 31.";drawCard();return;}
  const o=Object.assign({},S.items.get(x.id)||{},{kind:"card",id:x.id||uid(),tipo:x.tipo==="emprestimo"?"emprestimo":"credito",nome:x.nome,fechamento:fe,vencimento:ve,limite:lim,pagas:x.pagas||[]});
  closeSheet();await store.set(o);
}

function toggleIn(arr,v){arr=(arr||[]).slice();const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);return arr;}
let toastT;function toast(msg){clearTimeout(toastT);let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e);}e.textContent=msg;e.style.display="";toastT=setTimeout(()=>{e.style.display="none";},2200);}

// ---------- Armazenamento (só neste aparelho) ----------
const KEY="financas-v1", KEY_BK="financas-ultimo-backup";
let mem={};
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(mem));return true;}
  catch(e){S.note="Não consegui salvar no celular (memória cheia?). Faça um backup agora.";render();return false;}
}
function migraEmprestimos(){let mud=false;
  Object.values(mem).forEach(c=>{if(c.kind!=="card"||c.tipo!=="emprestimo"||!(c.pagas||[]).length)return;
    Object.values(mem).forEach(t=>{if(t.kind==="tx"&&t.cardId===c.id){const add=c.pagas.filter(m=>!(t.pagas||[]).includes(m));if(add.length)t.pagas=(t.pagas||[]).concat(add);}});
    c.pagas=[];mud=true;});
  if(mud)persist();}
function applyAll(){migraEmprestimos();S.items=new Map(Object.values(mem).map(o=>[o.id,o]));if(!S.loaded)S.month=perHoje();S.loaded=true;render();}
store={
  async set(o){mem[o.id]=JSON.parse(JSON.stringify(o));persist();applyAll();},
  async del(id){delete mem[id];persist();applyAll();}
};
function ultimoBackup(){try{return Number(localStorage.getItem(KEY_BK))||0;}catch(e){return 0;}}
function backupBanner(){
  if(!S.items.size)return"";
  const ult=ultimoBackup(), dias=ult?Math.floor((Date.now()-ult)/864e5):null;
  if(dias!=null&&dias<7)return"";
  return '<div class="banner" style="display:flex;gap:10px;align-items:center"><span style="flex:1">🦄 '+(dias==null?"Você ainda não fez nenhum backup.":"Já faz "+dias+" dias desde o último backup.")+' Seus dados ficam só neste celular.</span><button class="btn small" data-a="do-backup">Fazer backup</button></div>';
}
function backupMenu(){
  F={type:"backup"};
  const ult=ultimoBackup();
  const c=cfg();
  openSheet('<h3>Ajustes<button class="x" data-a="close">×</button></h3>'
   +'<label class="f">Dia em que você paga as contas</label><input class="inp" id="cfg-dia" inputmode="numeric" value="'+c.diaPag+'">'
   +'<label class="f">Como ver as contas na tela principal</label><div class="seg" style="margin:0"><button class="'+(c.visao!=="periodo"?"on":"")+'" data-a="visao" data-v="mes">Por mês</button><button class="'+(c.visao==="periodo"?"on":"")+'" data-a="visao" data-v="periodo">Por período</button></div>'
   +'<div class="hint">'+(c.visao==="periodo"?(()=>{const D=Math.min(28,Math.max(1,c.diaPag));return D>1?'Cada período vai do dia <b>'+D+'</b> até o dia <b>'+(D-1)+'</b> do mês seguinte. O que você recebe no dia '+D+' paga as contas que vencem até o dia '+(D-1)+'. Mudou o dia? Toque em Salvar ajustes.':'Com o dia 1, o período é igual ao mês.';})()
      :'Mostra as contas do dia 1 até o fim de cada mês. Escolha "Por período" se você recebe num dia e paga tudo que vence até o mesmo dia do mês seguinte.')+'</div>'
   +'<label class="f" style="margin-top:16px">Lembrete no Google Agenda (todo mês)</label>'
   +'<div class="two"><div><label class="f">Dia do lembrete</label><input class="inp" id="cfg-ldia" inputmode="numeric" value="'+c.lemDia+'"></div><div><label class="f">Horário</label><input class="inp" type="time" id="cfg-lhora" value="'+c.lemHora+'"></div></div>'
   +'<button class="btn" data-a="save-cfg" style="margin-top:10px">Salvar ajustes</button>'
   +'<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;color:var(--accent)" href="'+agendaLink()+'" target="_blank" rel="noopener">📅 Criar lembrete no Google Agenda</a>'
   +'<p style="font-size:13px;color:var(--muted);margin:6px 0 0">Salve os ajustes antes. Abre o Google Agenda com o lembrete pronto: confira se está na sua conta pessoal e toque em Salvar. A notificação chega mesmo com o app fechado.</p>'
   +temasHTML()
   +'<button class="btn ghost" style="color:var(--ink)" data-a="cats-menu" data-v="saida">🏷️ Gerenciar categorias</button>'
   +'<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:10px">Versão do app: <b>'+VERSAO+'</b></div>'
   +'<h3 style="margin-top:22px">Backup dos seus dados</h3>'
   +'<p style="margin:0 0 10px;color:var(--muted);font-size:14px">Seus dados ficam guardados só neste celular, sem internet e sem login. Se trocar de aparelho, perder o celular ou limpar os dados do Chrome, só o backup salva você.</p>'
   +'<div class="hint">Último backup: <b>'+(ult?new Date(ult).toLocaleDateString("pt-BR")+' às '+new Date(ult).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"nunca")+'</b> · '+S.items.size+' registro(s) no app</div>'
   +'<button class="btn" data-a="do-backup">💾 Fazer backup agora</button>'
   +'<p style="font-size:13px;color:var(--muted);margin:8px 0 0">Guarde o arquivo no seu Google Drive pessoal ou mande para você mesma no WhatsApp.</p>'
   +'<label class="btn ghost" style="display:block;text-align:center;color:var(--ink);cursor:pointer">📂 Restaurar de um backup<input type="file" id="restore-file" accept=".json,application/json" style="display:none"></label>');
}
async function doBackup(){
  const d=new Date(), nome="financas-backup-"+todayStr()+".json";
  const json=JSON.stringify({app:"minhas-financas",versao:1,criado:d.toISOString(),itens:Object.values(mem)},null,1);
  const blob=new Blob([json],{type:"application/json"});
  let ok=false;
  try{
    const file=new File([blob],nome,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup Minhas Finanças"});ok=true;}
  }catch(e){if(e&&e.name==="AbortError"){return;}}
  if(!ok){
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);ok=true;
  }
  try{localStorage.setItem(KEY_BK,String(Date.now()));}catch(e){}
  closeSheet();render();toast("Backup feito! 💜");
}
function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;try{data=JSON.parse(r.result);}catch(e){data=null;}
    if(!data||data.app!=="minhas-financas"||!Array.isArray(data.itens)){
      openSheet('<h3>Arquivo inválido<button class="x" data-a="close">×</button></h3><p>Esse arquivo não é um backup do Minhas Finanças.</p><button class="btn" data-a="close">Ok</button>');F={type:"msg"};return;}
    F={type:"restore",itens:data.itens.filter(o=>o&&o.id&&o.kind)};
    openSheet('<h3>Restaurar backup?<button class="x" data-a="close">×</button></h3>'
     +'<p>Backup de <b>'+new Date(data.criado).toLocaleDateString("pt-BR")+'</b> com '+F.itens.length+' registro(s).</p>'
     +'<div class="banner warn">Isso <b>substitui</b> tudo o que está no app agora ('+S.items.size+' registro(s)).</div>'
     +'<button class="btn" data-a="confirm-restore">Sim, restaurar</button><button class="btn ghost" style="color:var(--ink)" data-a="close">Cancelar</button>');
  };
  r.readAsText(file);
}
document.addEventListener("change",ev=>{if(ev.target.id==="restore-file"&&ev.target.files[0])restoreFile(ev.target.files[0]);});

function init(){
  try{mem=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){mem={};}
  applyAll();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    const tinha=!!navigator.serviceWorker.controller;let recarregou=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(tinha&&!recarregou){recarregou=true;location.reload();}});
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
  }
}
init();
})();
</script>
